<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive video test</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:14px;background:#222;color:#eee;}
  input{width:100%;padding:10px;font-size:15px;box-sizing:border-box;}
  button{margin:8px 0 16px;padding:10px 16px;font-size:15px;}
  h3{margin:22px 0 6px;font-size:15px;}
  .box{background:#000;border:2px solid #b8933f;position:relative;overflow:hidden;}
</style>
</head>
<body>
<h2 style="margin-top:0">Drive video test</h2>
<p>Paste your Google Drive video link, tap Show, then tell me which of A–E shows the WHOLE video inside its box and plays properly.</p>
<input id="u" placeholder="https://drive.google.com/file/d/.../view">
<button id="go">Show</button>
<div id="out"></div>
<script>
function id(u){
  var m=u.match(/drive\.google\.com\/file\/(?:u\/\d+\/)?d\/([A-Za-z0-9_-]+)/)||u.match(/[?&]id=([A-Za-z0-9_-]+)/);
  return m?m[1]:null;
}
document.getElementById('go').onclick=function(){
  var f=id(document.getElementById('u').value.trim());
  var out=document.getElementById('out');
  if(!f){out.textContent='Could not find the file id in that link.';return;}
  var src='https://drive.google.com/file/d/'+f+'/preview';
  var fr=function(style){return '<iframe src="'+src+'" allow="autoplay; fullscreen" allowfullscreen scrolling="no" style="border:0;'+style+'"></iframe>';};
  out.innerHTML=
   '<h3>A. 16:9 box, iframe fills it</h3><div class="box" style="padding-bottom:56.25%">'+fr('position:absolute;inset:0;width:100%;height:100%')+'</div>'+
   '<h3>B. Fixed height 230px</h3><div class="box">'+fr('display:block;width:100%;height:230px')+'</div>'+
   '<h3>C. Taller 4:3 box</h3><div class="box" style="padding-bottom:75%">'+fr('position:absolute;inset:0;width:100%;height:100%')+'</div>'+
   '<h3>D. Desktop size shrunk to fit</h3><div class="box" id="dBox">'+fr('position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0')+'</div>'+
   '<h3>E. Very tall 1:1 box</h3><div class="box" style="padding-bottom:100%">'+fr('position:absolute;inset:0;width:100%;height:100%')+'</div>';
  var d=document.getElementById('dBox');
  var k=d.clientWidth/960;
  d.style.height=(540*k)+'px';
  d.querySelector('iframe').style.transform='scale('+k+')';
};
</script>
</body>
</html>
