<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMT Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f3e9d8;
    --parchment:#efe2c8;
    --wood:#5b3a24;
    --wood-dark:#3d2717;
    --ink:#2b2118;
    --accent:#c1442e;
    --gold:#b8933f;
    --shadow: 0 12px 30px rgba(0,0,0,.45);

    /* ---- theme (editable per-section in Developer Mode) ---- */
    --font-title:'Berkshire Swash',Georgia,serif;
    --font-body:'IM Fell English','Georgia','Times New Roman',serif;

    --btn-bg:#f3e9d8;
    --btn-text:#2b2118;
    --btn-border:#2b2118;
    --btn-size:19px;
    --btn-outline-width:1.4px;

    --close-btn-size:34px;
    --project-nav-size:24px;
    --media-nav-size:36px;

    --landing-bg:#172318;
    --landing-title-color:#fffaf0;
    --landing-title-size:88px;
    --landing-slogan-color:#f0e6c8;
    --landing-slogan-size:14px;

    --intro-bg:#f2e9d8;
    --intro-text-color:#3a3226;
    --intro-text-size:16px;
    --intro-label-color:#c1442e;

    --shelf-bg:#1c120b;
    --spine-text-scale:1;
    --book-scale:1;

    --spread-cover-color:#451721;
    --spread-page-color:#e9d7ac;
    --spread-title-color:#7a6a4a;
    --spread-title-size:20px;
    --spread-name-color:#2b2118;
    --spread-name-size:22px;
    --spread-desc-color:#5a4f3c;
    --spread-desc-size:14px;
    --spread-author-color:#8a6a3a;
    --spread-author-size:15px;

    --project-paper-color:#e6d2a2;
    --project-title-color:#2b2118;
    --project-title-size:26px;
    --project-desc-color:#4a4030;
    --project-desc-size:14px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:var(--font-body);
    color:var(--ink);
    background:#111;
    overflow:hidden;
  }
  #app{
    position:relative;
    width:100vw;height:100vh;
    overflow:hidden;
  }
  .screen{
    position:absolute;
    inset:0;
    display:none;
    opacity:0;
    transform:scale(.96);
    transition:opacity .5s ease, transform .5s ease;
  }
  .screen.active{
    display:flex;
    opacity:1;
    transform:scale(1);
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    outline:none;
  }
  /* no button "shape" — just bold, outlined text so it still reads clearly
     over any background without a box around it */
  .btn{
    background:none;
    border:none;
    box-shadow:none;
    border-radius:0;
    color:var(--btn-bg);
    font-weight:800;
    padding:10px 20px;
    font-size:var(--btn-size);
    letter-spacing:2px;
    -webkit-text-stroke:var(--btn-outline-width) var(--btn-border);
    text-stroke:var(--btn-outline-width) var(--btn-border);
    paint-order:stroke fill;
    cursor:pointer;
    outline:none;
    transition:transform .15s ease, color .15s ease;
  }
  .btn:hover{
    transform:translateY(-3px);
    color:var(--accent);
  }
  .btn:active{ transform:translateY(0); }
  /* custom keyboard-focus indicator, since the default browser outline
     (usually blue) has nothing to blend into now that there's no button
     box behind the text */
  .btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:4px;
    border-radius:3px;
  }
  /* the introduction page has a light background, so the light fill/dark
     outline pairing from the rest of the site would nearly vanish here —
     swap it: dark fill, light outline, same bold look, readable on light */
  #screen-intro .btn{
    color:var(--btn-border);
    -webkit-text-stroke-color:var(--btn-bg);
    text-stroke-color:var(--btn-bg);
  }
  #screen-intro .btn:hover{ color:var(--accent); }

  .back-btn{
    position:absolute;
    top:24px;left:24px;
    z-index:20;
    padding:10px 22px;
    font-size:14px;
    letter-spacing:1px;
  }

  /* ---------- LANDING ---------- */
  #screen-landing{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
      linear-gradient(rgba(10,10,5,.35), rgba(10,10,5,.55)),
      radial-gradient(ellipse at 50% 20%, rgba(255,225,150,.25), transparent 55%),
      var(--landing-bg);
    background-size:cover;
    background-position:center;
    text-align:center;
  }
  .landing-glow{
    display:none;
  }
  .landing-slogan{
    color:var(--landing-slogan-color);
    letter-spacing:6px;
    font-size:var(--landing-slogan-size);
    text-transform:uppercase;
    margin-bottom:10px;
    opacity:.85;
    z-index:2;
  }
  .landing-title{
    color:var(--landing-title-color);
    font-family:var(--font-title);
    font-size:clamp(42px, 8vw, var(--landing-title-size));
    letter-spacing:4px;
    text-shadow:0 4px 24px rgba(0,0,0,.6), 0 0 40px rgba(255,220,150,.25);
    margin:0 0 46px 0;
    z-index:2;
  }
  #enterBtn{ z-index:2; }

  /* ---------- INTRO (mascot) ---------- */
  #screen-intro{
    align-items:center;
    justify-content:center;
    background:var(--intro-bg);
  }
  .intro-wrap{
    display:flex;
    align-items:center;
    gap:60px;
    max-width:900px;
    width:90%;
  }
  .mascot{
    width:180px;height:220px;
    flex-shrink:0;
    position:relative;
    animation:bob 2.4s ease-in-out infinite;
  }
  .mascot img{
    width:100%;height:100%;
    object-fit:contain;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
  }
  .mascot .hat{
    width:0;height:0;
    border-left:34px solid transparent;
    border-right:34px solid transparent;
    border-bottom:56px solid var(--accent);
    margin:0 auto;
    position:relative;
  }
  .mascot .hat::after{
    content:"";
    position:absolute;
    bottom:-6px;left:-40px;
    width:80px;height:10px;
    background:var(--gold);
    border-radius:4px;
  }
  .mascot .head{
    width:120px;height:100px;
    background:#e9e9ec;
    border:3px solid var(--ink);
    border-radius:38% 38% 45% 45%;
    margin:-4px auto 0;
    position:relative;
  }
  .mascot .visor{
    position:absolute;
    top:32px;left:50%;
    transform:translateX(-50%);
    width:78px;height:32px;
    background:#233043;
    border-radius:16px;
    box-shadow:inset 0 0 0 2px #4a6a9c;
  }
  .mascot .ear{
    position:absolute;
    top:6px;
    width:16px;height:22px;
    background:#e9e9ec;
    border:3px solid var(--ink);
    border-radius:8px 8px 0 0;
  }
  .mascot .ear.l{ left:-6px; } .mascot .ear.r{ right:-6px; }
  .mascot .body{
    width:110px;height:70px;
    background:#e9e9ec;
    border:3px solid var(--ink);
    border-radius:20px;
    margin:-6px auto 0;
    position:relative;
  }
  .mascot .core{
    position:absolute;
    top:22px;left:50%;
    transform:translateX(-50%);
    width:20px;height:20px;
    background:var(--gold);
    border-radius:50%;
    border:2px solid var(--ink);
  }
  .mascot .arm{
    position:absolute;
    top:14px;
    width:14px;height:44px;
    background:#3a7bd5;
    border:3px solid var(--ink);
    border-radius:10px;
  }
  .mascot .arm.l{ left:-16px; transform:rotate(-8deg); }
  .mascot .arm.r{ right:-16px; transform:rotate(8deg); }

  .intro-text{
    flex:1;
  }
  .intro-label{
    letter-spacing:4px;
    font-size:13px;
    color:var(--intro-label-color);
    margin-bottom:10px;
    text-transform:uppercase;
    font-weight:bold;
  }
  .intro-body{
    font-size:var(--intro-text-size);
    line-height:1.7;
    color:var(--intro-text-color);
    margin-bottom:26px;
    min-height:120px;
  }
  .intro-dots{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .intro-dots span{
    width:8px;height:8px;border-radius:50%;
    background:#d8cbaa;
  }
  .intro-dots span.active{ background:var(--accent); }

  /* ---------- SHELF (library) ---------- */
  #screen-shelf{
    flex-direction:column;
    align-items:center;
    background:var(--shelf-bg);
    padding:64px 32px 24px;
  }
  .bookcase-wrap{
    display:flex;
    align-items:stretch;
    gap:18px;
    flex:1;
    min-height:0;
    width:100%;
    justify-content:center;
  }
  .bookcase-viewport{
    width:100%;
    height:100%;
    overflow:hidden;
    position:relative;
    /* the shelf scrolls via its own JS touch handling, not native touch
       scroll, so tell the browser not to handle panning gestures here */
    touch-action:none;
    /* fade the very top/bottom of the shelf instead of a hard clip, so
       books scroll in/out smoothly rather than cutting off abruptly */
    mask-image:linear-gradient(to bottom,
      transparent 0, black 64px, black calc(100% - 64px), transparent 100%);
    -webkit-mask-image:linear-gradient(to bottom,
      transparent 0, black 64px, black calc(100% - 64px), transparent 100%);
  }
  .bookcase-stack{
    display:flex;
    flex-direction:column;
    will-change:transform;
  }
  .shelf-platform{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:0;
    min-height:400px;
    padding:0 10px 0;
    border-bottom:30px solid var(--wood);
    box-shadow:
      0 4px 0 rgba(0,0,0,.25),
      0 26px 24px -14px rgba(0,0,0,.65);
    margin-bottom:44px;
  }
  .book{
    --tilt:0deg;
    width:104px;
    position:relative;
    border:3px solid var(--ink);
    border-radius:5px 5px 0 0;
    padding:14px 8px;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-size:14.5px;
    /* side shadows fake a rounded/curved spine surface */
    box-shadow:
      0 3px 4px rgba(0,0,0,.35),
      inset 20px 0 20px -8px rgba(0,0,0,.65),
      inset -20px 0 20px -8px rgba(0,0,0,.65);
    letter-spacing:1px;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
    transition:transform .2s ease, box-shadow .2s ease;
    transform:rotate(var(--tilt));
    transform-origin:bottom center;
    flex-shrink:0;
    background-size:cover;
    background-position:center;
  }
  .book:hover{
    transform:rotate(var(--tilt)) translateY(-16px);
    box-shadow:
      0 20px 20px -10px rgba(0,0,0,.5),
      inset 16px 0 18px -8px rgba(0,0,0,.65),
      inset -16px 0 18px -8px rgba(0,0,0,.65);
  }
  /* long spine titles wrap into a second column instead of shrinking. This
     span is centered via absolute-position + transform (not flexbox) so
     centering is exact and consistent regardless of how many columns the
     text wraps into — flex's shrink-to-fit sizing under a vertical writing
     mode was unreliable across engines once text actually wrapped. */
  .book .spine-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    white-space:normal;
  }
  /* ---------- CATEGORY SPREAD (overlay window on top of the shelf) ---------- */
  #screen-category{
    position:fixed;
    inset:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  #screen-category.open{
    opacity:1;
    pointer-events:auto;
  }
  /* the open-book "cover": a dark leather-look frame with the two cream
     pages inset inside it, curved on their outer corners, like a real
     photographed open book rather than one flat wavy sheet */
  .book-spread{
    display:flex;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.08), transparent 60%),
      var(--spread-cover-color);
    border-radius:8px;
    box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.4);
    width:min(1180px,96vw);
    height:min(820px,92vh);
    position:relative;
    overflow:hidden;
    transform:scale(.92) translateY(16px);
    transition:transform .3s ease;
    perspective:1800px;
    padding:30px 22px;
  }
  #screen-category.open .book-spread{
    transform:scale(1) translateY(0);
  }
  .book-spread::before{
    content:"";
    position:absolute;
    top:0;bottom:0;left:50%;
    width:46px;
    margin-left:-23px;
    background:linear-gradient(90deg,
      transparent, rgba(0,0,0,.4) 40%, rgba(0,0,0,.55) 50%, rgba(0,0,0,.4) 60%, transparent
    );
    pointer-events:none;
    z-index:1;
  }
  .page{
    position:relative;
    flex:1;
    min-width:0;
    padding:40px 36px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:linear-gradient(180deg, color-mix(in srgb, var(--spread-page-color) 65%, white), var(--spread-page-color) 55%, color-mix(in srgb, var(--spread-page-color) 80%, black));
    box-shadow:inset 0 0 30px rgba(120,85,35,.15), 0 2px 10px rgba(0,0,0,.35);
  }
  /* signed like a name written inside the front cover of a real book — a
     small, slightly tilted, handwritten-feeling credit tucked in the
     bottom corner of each page, near the outer edge (away from the spine) */
  .proj-author{
    position:absolute;
    bottom:26px;
    max-width:calc(100% - 56px);
    font-family:var(--font-title);
    font-size:var(--spread-author-size);
    color:var(--spread-author-color);
    border-bottom:1px solid color-mix(in srgb, var(--spread-author-color) 60%, transparent);
    padding-bottom:2px;
    pointer-events:none;
  }
  .proj-author::before{ content:"— "; }
  #pageLeft .proj-author, .flip-page.left .proj-author{
    left:28px;
    text-align:left;
  }
  #pageRight .proj-author, .flip-page.right .proj-author{
    right:28px;
    text-align:right;
  }
  .cat-title{
    position:absolute;
    top:38px;
    width:50%;
    text-align:center;
    font-family:var(--font-title);
    letter-spacing:1px;
    font-size:var(--spread-title-size);
    color:var(--spread-title-color);
    z-index:6;
    pointer-events:none;
  }
  .cat-title-left{ left:0; }
  .cat-title-right{ right:0; }

  /* page-flip animation for spread prev/next */
  .flip-page{
    position:absolute;
    top:30px; bottom:30px;
    width:calc(50% - 22px);
    padding:40px 36px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:linear-gradient(180deg, color-mix(in srgb, var(--spread-page-color) 65%, white), var(--spread-page-color) 55%, color-mix(in srgb, var(--spread-page-color) 80%, black));
    backface-visibility:hidden;
    box-shadow:0 0 26px rgba(0,0,0,.3);
    z-index:5;
    pointer-events:none;
  }
  .flip-page.right{
    right:22px;
    transform-origin:left center;
    animation:flipNext .5s ease forwards;
  }
  .flip-page.left{
    left:22px;
    transform-origin:right center;
    animation:flipPrev .5s ease forwards;
  }
  @keyframes flipNext{
    from{ transform:rotateY(0deg); }
    to{ transform:rotateY(-150deg); }
  }
  @keyframes flipPrev{
    from{ transform:rotateY(0deg); }
    to{ transform:rotateY(150deg); }
  }
  .proj-thumb{
    width:100%;
    aspect-ratio:16/10;
    border-radius:4px;
    border:2px solid var(--ink);
    background-color:#567;
    background-image:linear-gradient(135deg, rgba(255,255,255,.15), transparent);
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
    margin-top:20px;
    margin-bottom:16px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 14px rgba(0,0,0,.2);
  }
  .proj-thumb:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 10px 20px rgba(0,0,0,.3);
  }
  .proj-name{
    font-family:var(--font-title);
    font-size:var(--spread-name-size);
    margin-bottom:10px;
    color:var(--spread-name-color);
  }
  .proj-desc{
    font-size:var(--spread-desc-size);
    line-height:1.65;
    color:var(--spread-desc-color);
    max-width:440px;
  }
  .spread-nav{
    position:absolute;
    bottom:38px;left:0;right:0;
    display:flex;
    justify-content:center;
    gap:16px;
    z-index:6;
  }
  .spread-nav button{
    background:transparent;
    border:none;
    font-size:22px;
    color:#7a6a4a;
    padding:4px 12px;
  }
  .spread-nav button:hover{ color:var(--accent); }
  .spread-nav button:disabled{ opacity:.25; cursor:default; }

  /* ---------- PROJECT DETAIL (overlay window) ---------- */
  #screen-project{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  #screen-project.open{
    opacity:1;
    pointer-events:auto;
  }
  .overlay-backdrop{
    position:absolute;
    inset:0;
    background:rgba(12,7,4,.72);
    backdrop-filter:blur(2px);
  }
  .project-window{
    position:relative;
    /* aged paper look: stain blotches + faint fiber lines over a sepia base */
    background:
      radial-gradient(circle at 15% 20%, rgba(120,85,35,.10), transparent 35%),
      radial-gradient(circle at 85% 15%, rgba(120,85,35,.08), transparent 40%),
      radial-gradient(circle at 75% 85%, rgba(110,75,30,.10), transparent 45%),
      radial-gradient(circle at 25% 90%, rgba(110,75,30,.07), transparent 40%),
      repeating-linear-gradient(0deg, rgba(90,60,20,.03) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, color-mix(in srgb, var(--project-paper-color) 70%, white), var(--project-paper-color) 55%, color-mix(in srgb, var(--project-paper-color) 82%, black));
    border-radius:4px;
    width:min(760px,90vw);
    max-height:88vh;
    /* the torn-edge clip-path below doesn't clip a native scrollbar cleanly
       across browsers — so this outer shape never scrolls itself; scrolling
       happens in .project-window-inner instead, which stays safely inside
       the clipped shape */
    overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 50px rgba(110,75,25,.25), inset 0 0 3px rgba(70,45,15,.4);
    /* pinned exactly to the true 0%/100% corner at each of the 4 corners
       (the old points were both slightly off-corner, which left a tiny
       triangular gap at each corner showing the backdrop through) — the
       wave in between is unchanged */
    clip-path:polygon(0% 0%, 12.5% 0.24%, 25.0% 1.04%, 37.5% 0.12%, 50.0% 0.86%, 62.5% 0.59%, 75.0% 0.09%, 87.5% 0.81%, 100% 0%, 99.89% 12.5%, 99.85% 25.0%, 99.32% 37.5%, 98.68% 50.0%, 99.8% 62.5%, 99.64% 75.0%, 99.0% 87.5%, 100% 100%, 87.5% 99.37%, 75.0% 98.44%, 62.5% 99.93%, 50.0% 98.63%, 37.5% 99.54%, 25.0% 99.77%, 12.5% 99.81%, 0% 100%, 0.29% 87.5%, 0.93% 75.0%, 1.02% 62.5%, 0.6% 50.0%, 0.88% 37.5%, 0.1% 25.0%, 0.1% 12.5%);
    transform:scale(.92) translateY(16px);
    transition:transform .3s ease;
  }
  #screen-project.open .project-window{
    transform:scale(1) translateY(0);
  }
  .project-window-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    padding:40px 38px 34px;
    max-height:88vh;
    overflow-y:auto;
    overflow-x:hidden; /* no horizontal scrollbar — content never needs it */
    scrollbar-width:thin;
    scrollbar-color:rgba(43,33,24,.35) transparent;
  }
  /* simple clean scrollbar: just a thin bar, no arrow buttons */
  .project-window-inner::-webkit-scrollbar{ width:7px; }
  .project-window-inner::-webkit-scrollbar-track{ background:transparent; }
  .project-window-inner::-webkit-scrollbar-thumb{
    background:rgba(43,33,24,.35);
    border-radius:999px;
  }
  .project-window-inner::-webkit-scrollbar-thumb:hover{ background:rgba(43,33,24,.55); }
  .project-window-inner::-webkit-scrollbar-button{ display:none; height:0; width:0; }
  /* project switcher: sits below the TV set as its own row, kept well
     away from the screen itself so it never reads as a "switch preview"
     control */
  .monitor-row{
    display:flex;
    justify-content:center;
  }
  /* switching between projects is a distinct, less-frequent action than
     browsing this one project's own previews/gallery — so it sits below
     everything else, set apart with a thin divider */
  .project-nav-controls{
    display:flex;
    align-items:center;
    gap:28px;
    margin-top:6px;
    padding-top:16px;
    border-top:1px solid rgba(43,33,24,.15);
    width:100%;
    justify-content:center;
  }
  .project-navbtn{
    flex-shrink:0;
    background:transparent;
    border:none;
    font-size:var(--project-nav-size);
    color:#7a6a4a;
    padding:4px 14px;
    cursor:pointer;
    transition:color .15s ease, transform .15s ease;
  }
  .project-navbtn:hover{ color:var(--accent); transform:scale(1.15); }

  /* preview switcher: only the small round arrow button itself is
     clickable — it used to be a full-height strip along each edge, which
     sat on top of the video/iframe and blocked its own controls (like the
     player's fullscreen button). Now it's just a small circle so the rest
     of the video surface is free for its own controls. */
  .media-nav{
    position:absolute;
    top:50%;
    width:var(--media-nav-size);height:var(--media-nav-size);
    transform:translateY(-50%);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:rgba(0,0,0,.45);
    color:#fff;
    font-size:calc(var(--media-nav-size) * .44);
    cursor:pointer;
    opacity:0;
    transition:opacity .18s ease, background .18s ease;
    z-index:6;
  }
  .media-nav:hover{ background:rgba(0,0,0,.7); }
  .media-nav-left{ left:10px; }
  .media-nav-right{ right:10px; }
  .monitor-screen:hover .media-nav{ opacity:1; }
  .media-nav:focus-visible{ opacity:1; }
  @media (hover:none){
    .media-nav{ opacity:.55; }
  }
  /* sits in the dark backdrop just outside the window itself (not inside
     the book/paper), so it never lands on a color seam or gets crowded by
     whatever's near the window's own corner */
  .overlay-close{
    position:absolute;
    top:22px;right:26px;
    width:var(--close-btn-size);height:var(--close-btn-size);
    border-radius:50%;
    background:var(--cream);
    border:2px solid var(--ink);
    font-size:calc(var(--close-btn-size) * .53);
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.5);
    transition:transform .15s ease;
    z-index:45;
  }
  .overlay-close:hover{ transform:scale(1.08); }
  /* framed like a small picture hung on the wall next to the paper, not a
     flatscreen TV: a warm wood border (matching the shelf's wood tones)
     with a thin brass inner lip around the screen — no bezel, no stand */
  .monitor{
    width:min(680px,80vw);
    background:linear-gradient(160deg, var(--wood), var(--wood-dark));
    border-radius:6px;
    border:1px solid rgba(0,0,0,.5);
    padding:14px;
    box-shadow:0 16px 34px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
    position:relative;
  }
  .monitor-screen{
    aspect-ratio:16/9;
    border-radius:2px;
    outline:3px solid var(--gold);
    outline-offset:-3px;
    overflow:hidden;
    background-color:#456;
    background-image:linear-gradient(135deg, rgba(255,255,255,.12), transparent);
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .play-icon{
    width:0;height:0;
    border-top:20px solid transparent;
    border-bottom:20px solid transparent;
    border-left:32px solid rgba(255,255,255,.9);
    filter:drop-shadow(0 0 8px rgba(0,0,0,.4));
  }
  /* removed everywhere — project detail preview screen and the book-spread
     thumbnails alike */
  #projectScreen .play-icon, .proj-thumb .play-icon{ display:none !important; }
  .gallery-strip{
    display:none;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    max-width:min(680px,80vw);
  }
  .gallery-thumb{
    width:64px;height:40px;
    border-radius:4px;
    border:2px solid rgba(43,33,24,.4);
    background-size:cover;
    background-position:center;
    background-color:#8a7a5c;
    cursor:pointer;
    opacity:.75;
    transition:opacity .15s ease, border-color .15s ease, transform .15s ease;
  }
  .gallery-thumb:hover{ opacity:1; transform:translateY(-2px); }
  .gallery-thumb.active{
    opacity:1;

  }

    align-items:center;

  }

  .project-info{

  }

    justify-content:space-between;

const STORAGE_KEY = 'dmtShowcaseSiteData';
function cloneDefaults(){ return JSON.parse(JSON.stringify(DEFAULTS)); }

// Loading priority:
// 1. localStorage — this browser's in-progress edits (from the dev panel), if any
// 2. data.json — the "published" content, hosted next to index.html, same for every visitor
// 3. built-in DEFAULTS — used if neither of the above is available yet
async function loadSiteData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){ console.warn('Could not read saved data, trying data.json next', e); }
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (res.ok) return await res.json();
  } catch(e){ /* no data.json published yet, or opened via file:// where fetch is blocked */ }
  return cloneDefaults();
}

// Optional: project name/description/video/preview can also come from a spreadsheet
// called "projects.xlsx" placed next to index.html. Expected columns (any order):
//   Category | Project Name | Description | Student Name | Video URL | Images
// "Category" must match one of the existing category names (case-insensitive).
// "Student Name" is optional — shows as a signature at the bottom of the book page.
// "Images" is optional: comma-separated image filenames/URLs, e.g. images/proj1.jpg, images/proj1b.jpg
// If projects.xlsx is present and readable, it replaces the projects list for any
// category it mentions (overriding both defaults and Developer Mode edits for those rows).
async function loadProjectsFromExcel(){
  if (typeof XLSX === 'undefined') return null;
  try {
    const res = await fetch('projects.xlsx', { cache: 'no-store' });
    if (!res.ok) return null;
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(sheet, { defval: '' });
  } catch(e){
    console.warn('No projects.xlsx found, or it failed to parse — using existing project data', e);
    return null;
  }
}
function getCol(row, ...names){
  for (const n of names){
    for (const key of Object.keys(row)){
      if (key.trim().toLowerCase() === n.toLowerCase()) return String(row[key]).trim();
    }
  }
  return '';
}
function applyExcelRowsToSiteData(rows){
  if (!rows || !rows.length) return;
  const byCategory = {};
  rows.forEach(row => {
    const catName = getCol(row, 'Category');
    const projName = getCol(row, 'Project Name', 'Project', 'Name');
    if (!catName || !projName) return;
    const imagesRaw = getCol(row, 'Images', 'Image URLs', 'Image');
    const proj = {
      name: projName,
      desc: getCol(row, 'Description', 'Desc'),
      author: getCol(row, 'Student Name', 'Student', 'Author'),
      videoUrl: getCol(row, 'Video URL', 'Video') || null,
      gallery: imagesRaw ? imagesRaw.split(',').map(s => s.trim()).filter(Boolean) : []
    };
    (byCategory[catName.toLowerCase()] ||= []).push(proj);
  });
  siteData.categories.forEach(cat => {
    const rows = byCategory[cat.name.toLowerCase()];
    if (rows && rows.length) cat.projects = rows;
  });
}

// is resized while it's the visible screen, so resizing/maximizing the
// browser — or rotating a phone — doesn't leave books sized for whatever
// width happened to be current the first time the shelf was opened
let shelfResizeTimer = null;

/* ---------------- shelf ---------------- */
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

// every size below is derived from the shelf's actual measured width, so
// book size / spacing / books-per-shelf scale continuously with the real
// screen ratio instead of jumping between two fixed breakpoints. Book width
// caps out on very wide screens (so spines don't get absurdly huge), but the
// gap between books is scaled from the width directly rather than from the
// (capped) book width, so spacing keeps growing on bigger screens even after
// the books themselves stop growing.
function shelfMetrics(availW){
  // book size is user-adjustable in Developer Mode (Theme > Bookshelf);
  // applied here (the single shared source for both packing math and
  // rendering) so the row-packing budget always matches the actual
  // rendered size and never overflows
  const bookScale = clamp(parseFloat(siteData.theme && siteData.theme['--book-scale']) || 1, 0.6, 1.6);
  const bookW = clamp(availW / 8.5, 58, 130) * bookScale;
  const gapUnit = clamp(availW / 40, 12, 50);
  return { bookW, gapUnit };
}

// margin on each side of a book is randomized between 0.3x and 0.85x gapUnit
// (see buildPlatform) — so the worst case total margin per book is 1.7x
// gapUnit; the row-width math below must budget for that worst case, not
// the average, or a run of maximum-margin books could still overflow
function chunkIntoPlatforms(list, availW){
  const { bookW, gapUnit } = shelfMetrics(availW);
  const worstSlot = bookW + gapUnit * 1.7;
  const maxPerRow = Math.max(2, Math.floor((availW * 0.96) / worstSlot));
  const cap = Math.min(maxPerRow, 5);
  const platforms = [];

  // "big" (Final Year Project) spines are ~1.35x wider than a regular book,
  // which the width-based cap below doesn't account for — so give any big
  // spine its own platform rather than risk it overflowing a shared row
  let run = [];
  const flushRun = () => {
    let i = 0;
    while (i < run.length){
      const remaining = run.length - i;
      let size = remaining <= cap ? remaining : (cap >= 4 && Math.random() < 0.5 ? cap - 1 : cap);
      size = Math.max(1, size);
      // avoid a tiny leftover platform, but never merge past the safe cap —
      // that was letting a leftover balloon a row past what actually fits
      if (remaining <= cap && remaining - size < Math.min(3, cap) && remaining - size > 0) size = remaining;
      platforms.push(run.slice(i, i + size));
      i += size;
    }
    run = [];
  };
  list.forEach(cat => {
    if (cat.big){
      flushRun();
      platforms.push([cat]);
    } else {
      run.push(cat);
    }
  });
  flushRun();

  return platforms;
}

function buildPlatform(group, availW){
  const platform = document.createElement('div');
  platform.className = 'shelf-platform';
  const { bookW, gapUnit } = shelfMetrics(availW);
  const textScale = parseFloat(siteData.theme && siteData.theme['--spine-text-scale']) || 1;
  group.forEach(({ cat, index }) => {
    const b = document.createElement('div');
    b.className = 'book';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'spine-text';
    nameSpan.textContent = cat.name;
    b.appendChild(nameSpan);
    b.dataset.catIndex = index;
    if (cat.image){
      // tint a black & white spine image with the category's own color:
      // a solid color layer multiplied over the (grayscale) image lets the
      // image's light/dark texture show through as shades of that color,
      // so every category can share the same photo/pattern but keep its
      // own distinct spine color
      b.style.backgroundColor = cat.color; // shows immediately while the image loads
      b.style.backgroundImage = `linear-gradient(${cat.color}, ${cat.color}), url('${cat.image}')`;
      b.style.backgroundSize = 'cover, cover';
      b.style.backgroundPosition = 'center, center';
      b.style.backgroundRepeat = 'no-repeat, no-repeat';
      b.style.backgroundBlendMode = 'multiply';
    } else {
      b.style.background = cat.color;
      b.style.backgroundBlendMode = '';
    }
    let height, baseFontSize;
    if (cat.big){
      // Final Year Project stands out: taller, wider, upright — same
      // aspect ratio as the rest, just scaled up
      const w = bookW * 1.35;
      height = w * 3.05;
      baseFontSize = clamp(w * 0.135, 13, 19);
      b.style.width = w + 'px';
      b.style.color = '#4a3410';
      b.style.textShadow = 'none';
      b.style.setProperty('--tilt', '0deg');
    } else {
      // vary height so tops look uneven, like real books on a shelf —
      // height stays proportional to width so books never look short/fat
      height = bookW * 2.9 + Math.random() * bookW * 0.85;
      baseFontSize = clamp(bookW * 0.155, 11.5, 16.5);
      b.style.width = bookW + 'px';
      // slight random lean, like a book left slightly askew
      b.style.setProperty('--tilt', (Math.random() * 8 - 4).toFixed(1) + 'deg');
    }
    b.style.height = height + 'px';
    // long category names wrap into a second column instead of shrinking
    // to fit one — the span's exact height forces the wrap point, and
    // since the span is still just one flex item, .book's centering keeps
    // the whole (possibly two-column) block centered as a group
    const usableHeight = height - 28; // minus the spine's own top/bottom padding
    const singleColCapacity = usableHeight / (baseFontSize + 1); // chars per column, +1 for letter-spacing
    const needsWrap = cat.name.length > singleColCapacity;
    let fontSize = baseFontSize;
    if (needsWrap && cat.name.length > singleColCapacity * 2){
      // even two columns can't fit it at normal size — shrink just enough
      // so the whole name fits across exactly two columns
      fontSize = Math.max(8, (usableHeight * 2) / (cat.name.length * 1.05));
    }
    const scaledFontSize = fontSize * textScale;
    b.style.fontSize = scaledFontSize + 'px';
    // max-height (not a fixed height) is the key: short text is smaller
    // than this cap so it just auto-sizes to its own content and the flex
    // centering centers that shrink-to-fit box exactly like before: only
    // text that actually exceeds the cap gets wrapped into a second column
    // by the browser's own line-breaking, so there's no estimate to get
    // wrong and nothing to mis-center
    nameSpan.style.maxHeight = usableHeight + 'px';
    if (needsWrap){
      // widen the spine if two columns of text need more room than its
      // default width gives them (rare — most spines are already wide
      // enough for two columns at these font sizes)
      const colThickness = scaledFontSize + 1;
      const neededBoxWidth = colThickness * 2 + 22; // 2 columns + padding(16) + border(6)
      const currentWidth = parseFloat(b.style.width);
      if (neededBoxWidth > currentWidth){
        b.style.width = Math.min(neededBoxWidth, currentWidth * 1.6) + 'px';
      }
    }
    // random gap around each book, scaled to book size so spacing always
    // reads the same relative to the books, on any screen ratio
    b.style.marginLeft = (gapUnit * (0.3 + Math.random() * 0.55)) + 'px';
    b.style.marginRight = (gapUnit * (0.3 + Math.random() * 0.55)) + 'px';
    platform.appendChild(b);
  });
  return platform;
}
function attachBookHandlers(container){
  container.querySelectorAll('.book').forEach(b => {
    const idx = parseInt(b.dataset.catIndex, 10);
    b.addEventListener('click', () => openCategory(idx));
  });
}

function renderShelf(){
  const stack = $('bookcaseStack');
  stack.innerHTML = '';
  let globalIndex = 0;
  // measure the real available width so book size/spacing/count-per-shelf
  // scale with the actual screen ratio, not a fixed phone/desktop switch
  const viewportEl = document.querySelector('.bookcase-viewport');
  const availW = (viewportEl && viewportEl.clientWidth) || window.innerWidth;
  const platforms = chunkIntoPlatforms(siteData.categories, availW).map(group =>
    group.map(cat => ({ cat, index: globalIndex++ }))
  );

  // build one real copy (randomized), then clone it for a second, identical
  // copy right after — scrolling past the end lands you back at a pixel-perfect
  // match for the start, so the loop feels endless
  const loopStart = document.createDocumentFragment();
  platforms.forEach(group => loopStart.appendChild(buildPlatform(group, availW)));
  stack.appendChild(loopStart);
  attachBookHandlers(stack);

  const clone = stack.cloneNode(true);
  const newPlatforms = Array.from(clone.children);
  newPlatforms.forEach(p => {
    stack.appendChild(p);
    attachBookHandlers(p);
  });

  setupShelfSlider();
}

function setupShelfSlider(){
  const viewport = document.querySelector('.bookcase-viewport');
  const stack = $('bookcaseStack');
  // wait a frame so layout/heights are settled
  requestAnimationFrame(() => {
    const loopHeight = stack.scrollHeight / 2;
    let offset = 0;
    stack.style.transform = 'translateY(0px)';

    const moveTo = (value) => {
      // wrap around the loop point so scrolling past the bottom
      // seamlessly continues from the (identical) top copy
      offset = ((value % loopHeight) + loopHeight) % loopHeight;
      stack.style.transform = `translateY(-${offset}px)`;
    };

    // mouse wheel / trackpad scrolls the shelf
    viewport.onwheel = (e) => {
      e.preventDefault();
      moveTo(offset + e.deltaY);
    };

    // finger drag scrolls the shelf on touch devices — the shelf uses a
    // custom transform (not native scroll) so it needs its own touch
    // handling, there's no scrollbar underneath to fall back on
    let touchStartY = 0, touchStartOffset = 0, dragging = false;
    viewport.ontouchstart = (e) => {
      if (!e.touches.length) return;
      dragging = true;
      touchStartY = e.touches[0].clientY;
      touchStartOffset = offset;
    };
    viewport.ontouchmove = (e) => {
      if (!dragging || !e.touches.length) return;
      e.preventDefault();
      const dy = touchStartY - e.touches[0].clientY;
      moveTo(touchStartOffset + dy);
    };
    viewport.ontouchend = () => { dragging = false; };
    viewport.ontouchcancel = () => { dragging = false; };
  });
}

// narrow screens show one project page at a time instead of a two-page spread
function isMobileSpread(){

}
function renderSpread(){
  const cat = siteData.categories[currentCat];
  $('catTitleLeft').textContent = cat.name;
  $('catTitleRight').textContent = cat.name;
  const mobile = isMobileSpread();
  const step = mobile ? 1 : 2;

  const right = mobile ? null : cat.projects[spreadStart + 1];
  $('pageLeft').innerHTML = pageHTML(left);
  $('pageRight').innerHTML = right ? pageHTML(right) : '';
  $('spreadPrev').disabled = spreadStart === 0;
  $('spreadNext').disabled = spreadStart + step >= cat.projects.length;

  document.querySelectorAll('.proj-thumb').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx, 10);
      openProject(currentCat, idx);
    });

}
function pageHTML(proj){
  if (!proj) return '';
  const cat = siteData.categories[currentCat];
  const idx = cat.projects.indexOf(proj);
  const cover = (proj.gallery && proj.gallery.length ? proj.gallery[0] : null)
    || (proj.videoUrl ? videoThumbUrl(proj.videoUrl) : null);
  // data URLs / remote thumbnail URLs need url(...) wrapping in CSS; plain
  // hex colors don't — build the right background style for whichever we have
  const style = cover
    ? `background-image:linear-gradient(135deg, rgba(255,255,255,.15), transparent), url('${cover}')`
    : `background-color:${cat.color}`;
  const showPlay = !cover || proj.videoUrl;
  return `
    <div class="proj-thumb" style="${style}" data-idx="${idx}">
      ${showPlay ? '<div class="play-icon"></div>' : ''}
    </div>
    <div class="proj-name">${proj.name}</div>
    <div class="proj-desc">${proj.desc}</div>
    ${proj.author ? `<div class="proj-author">${proj.author}</div>` : ''}
  `;
}
function flipSpread(direction){
  const spreadEl = document.querySelector('.book-spread');
  const isNext = direction === 'next';
  const mobile = isMobileSpread();
  // on mobile only pageLeft is ever shown (single page at a time), so that's
  // always the page being flipped away, regardless of direction
  const sourceEl = mobile ? $('pageLeft') : (isNext ? $('pageRight') : $('pageLeft'));
  if (!sourceEl.innerHTML.trim()) return; // nothing on that page to flip

  // snapshot the current page as a floating clone, then swap the real
  // content underneath immediately so the new page is revealed as it turns
  const clone = document.createElement('div');
  clone.className = 'flip-page ' + (isNext ? 'right' : 'left');
  clone.innerHTML = sourceEl.innerHTML;
  spreadEl.appendChild(clone);
  clone.addEventListener('animationend', () => clone.remove(), { once:true });

  spreadStart += isNext ? (mobile ? 1 : 2) : (mobile ? -1 : -2);
  renderSpread();
}
$('spreadPrev').addEventListener('click', () => flipSpread('prev'));
$('spreadNext').addEventListener('click', () => flipSpread('next'));

/* ---------------- project detail (overlay window) ---------------- */
let galleryIndex = 0;
function openProject(catIdx, projIdx){
  currentProjectRef = { catIdx, projIdx };
  galleryIndex = 0;
  renderProject();
  $('screen-project').classList.add('open');
}
function renderProject(){
  const { catIdx, projIdx } = currentProjectRef;
  const cat = siteData.categories[catIdx];
  const projects = cat.projects;
  const proj = projects[projIdx];
  const items = getMediaItems(proj);
  if (galleryIndex >= items.length) galleryIndex = 0;
  const current = items[galleryIndex] || null;
  const screenEl = $('projectScreen');

  // clear anything injected on a previous render (iframe or fallback link)
  const oldFrame = screenEl.querySelector('iframe');
  if (oldFrame) oldFrame.remove();
  const oldFallback = screenEl.querySelector('.video-fallback');
  if (oldFallback) oldFallback.remove();
  const oldWatchLink = screenEl.querySelector('.watch-link');
  if (oldWatchLink) oldWatchLink.remove();

  if (current && current.type === 'video'){
    // show the video's own thumbnail behind everything first, so there's
    // always something visible even if the embed itself fails to render
    // (e.g. blocked when opened via a local file:// page instead of a server)
    const thumb = videoThumbUrl(current.url);
    if (thumb){
      screenEl.style.backgroundImage = `url('${thumb}')`;
      screenEl.style.backgroundColor = '#000';
    } else {
      screenEl.style.backgroundImage = 'none';
      screenEl.style.backgroundColor = '#000';
    }
    screenEl.querySelector('.play-icon').style.display = 'none';
    const embed = videoEmbedUrl(current.url);
    if (embed){
      const iframe = document.createElement('iframe');
      iframe.src = embed;
      iframe.style.cssText = 'width:100%;height:100%;border:0;border-radius:4px;';
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
      iframe.allowFullscreen = true;
      screenEl.appendChild(iframe);
      // always-visible fallback link too — if the embed is blocked (common
      // when the page is opened via file:// instead of a real server) this
      // is the guaranteed way to actually watch it
      const watchLink = document.createElement('a');
      watchLink.className = 'watch-link';
      watchLink.href = current.url;
      watchLink.target = '_blank';
      watchLink.rel = 'noopener';
      watchLink.textContent = 'Watch on YouTube ↗';
      screenEl.appendChild(watchLink);
    } else {
      // couldn't recognize the link as a YouTube/Vimeo video — embedding the
      // raw page would just fail (YouTube/Vimeo block framing non-embed
      // pages), so link out instead of showing a broken blank frame
      const fallback = document.createElement('a');
      fallback.className = 'video-fallback';
      fallback.href = current.url;
      fallback.target = '_blank';
      fallback.rel = 'noopener';
      fallback.textContent = 'Link not recognized as YouTube — open video ↗';
      screenEl.appendChild(fallback);
    }
  } else if (current && current.type === 'image'){
    screenEl.style.backgroundImage = `linear-gradient(135deg, rgba(255,255,255,.12), transparent), url('${current.src}')`;
    screenEl.style.backgroundColor = '';
    screenEl.querySelector('.play-icon').style.display = 'none';
  } else {
    screenEl.style.backgroundImage = 'linear-gradient(135deg, rgba(255,255,255,.12), transparent)';
    screenEl.style.backgroundColor = cat.color;
    screenEl.querySelector('.play-icon').style.display = 'block';
  }

  $('projectTitle').textContent = proj.name;
  $('projectDesc').textContent = proj.desc + " (Full write-up, credits, and media go here.)";
  const multi = projects.length > 1;
  $('projectPrev').style.display = multi ? 'flex' : 'none';
  $('projectNext').style.display = multi ? 'flex' : 'none';
  const mediaMulti = items.length > 1;
  $('mediaPrev').style.display = mediaMulti ? 'flex' : 'none';
  $('mediaNext').style.display = mediaMulti ? 'flex' : 'none';
  renderGalleryStrip(items);
}
function goToMedia(delta){
  const { catIdx, projIdx } = currentProjectRef;
  const proj = siteData.categories[catIdx].projects[projIdx];
  const items = getMediaItems(proj);
  if (items.length < 2) return;
  galleryIndex = (galleryIndex + delta + items.length) % items.length;
  renderProject();
}
function renderGalleryStrip(items){
  const strip = $('galleryStrip');
  if (!items || items.length < 2){
    strip.innerHTML = '';
    strip.style.display = 'none';
    return;
  }
  strip.style.display = 'flex';
  strip.innerHTML = items.map((item, i) => {
    const active = i === galleryIndex ? ' active' : '';
    if (item.type === 'video'){
      const thumb = videoThumbUrl(item.url);
      const style = thumb ? `background-image:url('${thumb}')` : 'background-color:#222';
      return `<div class="gallery-thumb video-thumb${active}" data-i="${i}" style="${style}"><span class="gallery-play">&#9654;</span></div>`;
    }
    return `<div class="gallery-thumb${active}" data-i="${i}" style="background-image:url('${item.src}')"></div>`;
  }).join('');
  strip.querySelectorAll('.gallery-thumb').forEach(el => {
    el.addEventListener('click', () => {
      galleryIndex = parseInt(el.dataset.i, 10);
      renderProject();
    });
  });
}
function goToProject(delta){
  const { catIdx, projIdx } = currentProjectRef;
  const projects = siteData.categories[catIdx].projects;
  // wraps around so you can keep browsing without going back to the book
  const nextIdx = (projIdx + delta + projects.length) % projects.length;
  currentProjectRef = { catIdx, projIdx: nextIdx };
  galleryIndex = 0;
  renderProject();
}
function closeProject(){
  $('screen-project').classList.remove('open');
}

// swipe to switch between previews (image/video) on touch devices — works
// for image previews; video iframes capture their own touch events, so on
// videos the on-screen arrows (visible via the @media(hover:none) rule
// above) are the reliable way to switch on mobile
(() => {
  const screenEl = $('projectScreen');
  let touchStartX = 0, touchStartY = 0;
  screenEl.addEventListener('touchstart', (e) => {
    if (!e.touches.length) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  screenEl.addEventListener('touchend', (e) => {
    if (!e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5){
      goToMedia(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

/* ---------------- video link helpers (YouTube / Vimeo) ---------------- */
function parseYouTubeId(url){
  if (!url) return null;
  // handles watch?v=, youtu.be/, embed/, shorts/, live/, and m./music. subdomains,
  // regardless of where "v=ID" or the path segment falls in the URL
  let m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if (m) return m[1];
  m = url.match(/[?&]v=([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function parseVimeoId(url){
  if (!url) return null;
  const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : null;
}
function videoEmbedUrl(url){
  const yt = parseYouTubeId(url);
  // rel=0 keeps "related videos" to the same channel only, modestbranding
  // trims the YouTube logo, iv_load_policy=3 hides annotation callouts
  if (yt) return `https://www.youtube.com/embed/${yt}?rel=0&modestbranding=1&iv_load_policy=3`;
  const vm = parseVimeoId(url);
  // title/byline/portrait=0 strips Vimeo's title bar, author name, and avatar overlay
  if (vm) return `https://player.vimeo.com/video/${vm}?title=0&byline=0&portrait=0`;
  return null;
}
function videoThumbUrl(url){
  const yt = parseYouTubeId(url);
  if (yt) return `https://img.youtube.com/vi/${yt}/hqdefault.jpg`;
  return null; // Vimeo thumbnails need an API call — falls back to a generic tile
}
function getMediaItems(proj){
  const items = [];
  if (proj.videoUrl) items.push({ type: 'video', url: proj.videoUrl });
  (proj.gallery || []).forEach(src => items.push({ type: 'image', src }));
  return items;
}

/* ================= developer mode ================= */
function fileToDataURL(file, maxDim, quality){
  maxDim = maxDim || 900;
  quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function escapeHTML(s){
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function escapeAttr(s){
  return String(s).replace(/"/g, '&quot;');
}

      const ci = parseInt(e.target.dataset.cat, 10);
      siteData.categories[ci].projects.push({
        name: `${siteData.categories[ci].name} — New Project`,
        desc: '',
        author: '',
        videoUrl: null,
        gallery: []
      });
      rerenderDevPanelKeepingOpenCats();
    });
  });
  document.querySelectorAll('.devRemoveProjectBtn').forEach(el => {
    el.addEventListener('click', (e) => {
      const ci = parseInt(e.target.dataset.cat, 10), pi = parseInt(e.target.dataset.proj, 10);
      if (siteData.categories[ci].projects.length <= 1) return; // keep at least one project
      if (!confirm('Remove this project? This cannot be undone until you reload without saving.')) return;
      siteData.categories[ci].projects.splice(pi, 1);
      rerenderDevPanelKeepingOpenCats();
    });
  });

  wireGalleryRemoveButtons();
}

// re-render the dev panel body after the project list changes, without
// collapsing whichever category the user currently has open
function rerenderDevPanelKeepingOpenCats(){
  const openCats = Array.from(document.querySelectorAll('.dev-cat.open')).map(el => el.dataset.cat);
  renderDevPanel();
  openCats.forEach(ci => {
    const el = document.querySelector(`.dev-cat[data-cat="${ci}"]`);
    if (el) el.classList.add('open');
  });
}

function galleryListHTML(ci, pi){
  const gallery = siteData.categories[ci].projects[pi].gallery;
  if (!gallery.length) return '<div class="dev-gallery-empty">No screenshots added yet</div>';
  return gallery.map((src, gi) => `
    <div class="dev-gallery-item" style="background-image:url('${src}')">
      <button class="dev-gallery-remove" data-cat="${ci}" data-proj="${pi}" data-g="${gi}">&times;</button>
    </div>
  `).join('');
}
function refreshGalleryList(ci, pi){
  const listEl = document.querySelector(`[data-gallery-list="${ci}-${pi}"]`);
  if (listEl) listEl.innerHTML = galleryListHTML(ci, pi);
  wireGalleryRemoveButtons();
}
function wireGalleryRemoveButtons(){
  document.querySelectorAll('.dev-gallery-remove').forEach(btn => {
    btn.onclick = (e) => {
      const ci = parseInt(e.target.dataset.cat, 10), pi = parseInt(e.target.dataset.proj, 10), gi = parseInt(e.target.dataset.g, 10);
      siteData.categories[ci].projects[pi].gallery.splice(gi, 1);
      refreshGalleryList(ci, pi);
    };
  });
}

function applyAndRerenderEverything(){
  applyBasics();
  renderShelf();
  if (currentCat !== null) renderSpread();
  if (currentProjectRef) renderProject();
}

if (!DEV_MODE_ENABLED){
  $('devToggleBtn').style.display = 'none';
} else {
  $('devToggleBtn').addEventListener('click', () => {
    const entered = prompt('Developer mode password:');
    if (entered === null) return; // cancelled
    if (entered !== DEV_PASSWORD){
      alert('Wrong password.');
      return;
    }
    renderDevPanel();
    $('devPanel').classList.add('open');
  });
}
$('devCloseBtn').addEventListener('click', () => $('devPanel').classList.remove('open'));
$('devSaveBtn').addEventListener('click', () => {
  saveSiteData();
  applyAndRerenderEverything();
  $('devSaveBtn').textContent = 'Saved!';
  setTimeout(() => { $('devSaveBtn').textContent = 'Save & apply'; }, 1200);
});
$('devExportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(siteData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(url);
});
$('devImportInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    siteData = parsed;
    saveSiteData();
    renderDevPanel();
    applyAndRerenderEverything();
    alert('Imported! Changes are applied.');
  } catch(err){
    alert('That file could not be read as valid site data JSON.');
  }
  e.target.value = '';
});
$('devResetBtn').addEventListener('click', () => {
  if (!confirm('Reset everything back to the default placeholder content? This clears all your saved edits in this browser.')) return;
  siteData = cloneDefaults();
  localStorage.removeItem(STORAGE_KEY);
  renderDevPanel();
  applyAndRerenderEverything();
});

/* ================= init ================= */
(async () => {
  siteData = await loadSiteData();
  try {
    const rows = await loadProjectsFromExcel();
    if (rows) applyExcelRowsToSiteData(rows);
  } catch(e){ console.warn('Could not apply projects.xlsx', e); }
  applyBasics();
})();
</script>
</body>
</html>
