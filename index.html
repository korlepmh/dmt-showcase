<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMT Showcase</title>
<style>
  :root{
    --cream:#f3e9d8;
    --parchment:#efe2c8;
    --wood:#5b3a24;
    --wood-dark:#3d2717;
    --ink:#2b2118;
    --accent:#c1442e;
    --gold:#b8933f;
    --shadow: 0 12px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Georgia','Times New Roman',serif;
    color:var(--ink);
    background:#111;
    overflow:hidden;
  }
  #app{
    position:relative;
    width:100vw;height:100vh;
    overflow:hidden;
  }
  .screen{
    position:absolute;
    inset:0;
    display:none;
    opacity:0;
    transform:scale(.96);
    transition:opacity .5s ease, transform .5s ease;
  }
  .screen.active{
    display:flex;
    opacity:1;
    transform:scale(1);
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    outline:none;
  }
  .btn{
    background:var(--cream);
    border:2px solid var(--ink);
    color:var(--ink);
    padding:14px 42px;
    font-size:18px;
    letter-spacing:2px;
    border-radius:4px;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{
    transform:translateY(-3px);
    background:#fff;
    box-shadow:0 16px 34px rgba(0,0,0,.5);
  }
  .btn:active{ transform:translateY(0); }

  .back-btn{
    position:absolute;
    top:24px;left:24px;
    z-index:20;
    padding:10px 22px;
    font-size:14px;
    letter-spacing:1px;
  }

  /* ---------- LANDING ---------- */
  #screen-landing{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
      linear-gradient(rgba(10,10,5,.35), rgba(10,10,5,.55)),
      radial-gradient(ellipse at 50% 20%, rgba(255,225,150,.25), transparent 55%),
      linear-gradient(180deg,#1c2b17 0%, #172318 40%, #0e160f 100%);
    background-size:cover;
    background-position:center;
    text-align:center;
  }
  .landing-glow{
    position:absolute;
    inset:0;
    background:
      repeating-radial-gradient(circle at 15% 30%, rgba(120,40,40,.18) 0 2px, transparent 2px 60px),
      repeating-radial-gradient(circle at 85% 70%, rgba(60,90,50,.18) 0 2px, transparent 2px 70px);
    opacity:.6;
    pointer-events:none;
  }
  .landing-slogan{
    color:#f0e6c8;
    letter-spacing:6px;
    font-size:14px;
    text-transform:uppercase;
    margin-bottom:10px;
    opacity:.85;
    z-index:2;
  }
  .landing-title{
    color:#fffaf0;
    font-size:clamp(42px,8vw,88px);
    letter-spacing:6px;
    text-shadow:0 4px 24px rgba(0,0,0,.6), 0 0 40px rgba(255,220,150,.25);
    margin:0 0 46px 0;
    z-index:2;
  }
  #enterBtn{ z-index:2; }

  /* ---------- INTRO (mascot) ---------- */
  #screen-intro{
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg,#fdfaf3,#f2e9d8);
  }
  .intro-wrap{
    display:flex;
    align-items:center;
    gap:60px;
    max-width:900px;
    width:90%;
  }
  .mascot{
    width:180px;height:220px;
    flex-shrink:0;
    position:relative;
    animation:bob 2.4s ease-in-out infinite;
  }
  .mascot img{
    width:100%;height:100%;
    object-fit:contain;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
  }
  .mascot .hat{
    width:0;height:0;
    border-left:34px solid transparent;
    border-right:34px solid transparent;
    border-bottom:56px solid var(--accent);
    margin:0 auto;
    position:relative;
  }
  .mascot .hat::after{
    content:"";
    position:absolute;
    bottom:-6px;left:-40px;
    width:80px;height:10px;
    background:var(--gold);
    border-radius:4px;
  }
  .mascot .head{
    width:120px;height:100px;
    background:#e9e9ec;
    border:3px solid var(--ink);
    border-radius:38% 38% 45% 45%;
    margin:-4px auto 0;
    position:relative;
  }
  .mascot .visor{
    position:absolute;
    top:32px;left:50%;
    transform:translateX(-50%);
    width:78px;height:32px;
    background:#233043;
    border-radius:16px;
    box-shadow:inset 0 0 0 2px #4a6a9c;
  }
  .mascot .ear{
    position:absolute;
    top:6px;
    width:16px;height:22px;
    background:#e9e9ec;
    border:3px solid var(--ink);
    border-radius:8px 8px 0 0;
  }
  .mascot .ear.l{ left:-6px; } .mascot .ear.r{ right:-6px; }
  .mascot .body{
    width:110px;height:70px;
    background:#e9e9ec;
    border:3px solid var(--ink);
    border-radius:20px;
    margin:-6px auto 0;
    position:relative;
  }
  .mascot .core{
    position:absolute;
    top:22px;left:50%;
    transform:translateX(-50%);
    width:20px;height:20px;
    background:var(--gold);
    border-radius:50%;
    border:2px solid var(--ink);
  }
  .mascot .arm{
    position:absolute;
    top:14px;
    width:14px;height:44px;
    background:#3a7bd5;
    border:3px solid var(--ink);
    border-radius:10px;
  }
  .mascot .arm.l{ left:-16px; transform:rotate(-8deg); }
  .mascot .arm.r{ right:-16px; transform:rotate(8deg); }

  .intro-text{
    flex:1;
  }
  .intro-label{
    letter-spacing:4px;
    font-size:13px;
    color:var(--accent);
    margin-bottom:10px;
    text-transform:uppercase;
    font-weight:bold;
  }
  .intro-body{
    font-size:16px;
    line-height:1.7;
    color:#3a3226;
    margin-bottom:26px;
    min-height:120px;
  }
  .intro-dots{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .intro-dots span{
    width:8px;height:8px;border-radius:50%;
    background:#d8cbaa;
  }
  .intro-dots span.active{ background:var(--accent); }

  /* ---------- SHELF (library) ---------- */
  #screen-shelf{
    flex-direction:column;
    align-items:center;
    background:linear-gradient(180deg,#2a1c12,#1c120b);
    padding:20px 20px;
  }
  .shelf-title{
    flex-shrink:0;
    color:#f3e6c8;
    letter-spacing:4px;
    font-size:15px;
    text-transform:uppercase;
    margin-bottom:16px;
    text-align:center;
  }
  .bookcase-wrap{
    display:flex;
    align-items:stretch;
    gap:18px;
    flex:1;
    min-height:0;
    width:100%;
    justify-content:center;
  }
  .bookcase-viewport{
    width:min(560px,80vw);
    height:100%;
    overflow:hidden;
    position:relative;
  }
  .bookcase-stack{
    display:flex;
    flex-direction:column;
    will-change:transform;
  }
  .shelf-platform{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:0;
    min-height:210px;
    padding:0 10px 0;
    border-bottom:14px solid var(--wood);
    box-shadow:0 18px 20px -12px rgba(0,0,0,.6);
    margin-bottom:36px;
  }
  .book{
    --tilt:0deg;
    width:54px;
    border:2px solid var(--ink);
    border-radius:4px 4px 0 0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px 6px;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-size:13px;
    /* side shadows fake a rounded/curved spine surface */
    box-shadow:
      0 3px 4px rgba(0,0,0,.35),
      inset 16px 0 18px -8px rgba(0,0,0,.65),
      inset -16px 0 18px -8px rgba(0,0,0,.65);
    letter-spacing:1px;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
    transition:transform .2s ease, box-shadow .2s ease;
    transform:rotate(var(--tilt));
    transform-origin:bottom center;
    flex-shrink:0;
    background-size:cover;
    background-position:center;
  }
  .book:hover{
    transform:rotate(var(--tilt)) translateY(-16px);
    box-shadow:
      0 20px 20px -10px rgba(0,0,0,.5),
      inset 16px 0 18px -8px rgba(0,0,0,.65),
      inset -16px 0 18px -8px rgba(0,0,0,.65);
  }
  /* ---------- CATEGORY SPREAD (overlay window on top of the shelf) ---------- */
  #screen-category{
    position:fixed;
    inset:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  #screen-category.open{
    opacity:1;
    pointer-events:auto;
  }
  .book-spread{
    display:flex;
    background:var(--parchment);
    border-radius:6px;
    box-shadow:0 30px 70px rgba(0,0,0,.6);
    width:min(1180px,96vw);
    height:min(820px,92vh);
    position:relative;
    overflow:hidden;
    transform:scale(.92) translateY(16px);
    transition:transform .3s ease;
    perspective:1800px;
  }
  #screen-category.open .book-spread{
    transform:scale(1) translateY(0);
  }
  .book-spread::before{
    content:"";
    position:absolute;
    top:0;bottom:0;left:50%;
    width:2px;
    background:rgba(0,0,0,.15);
    box-shadow:0 0 12px rgba(0,0,0,.15);
    z-index:1;
  }
  .page{
    flex:1;
    padding:48px 44px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-width:0;
  }
  .cat-title{
    position:absolute;
    top:16px;left:0;right:0;
    text-align:center;
    letter-spacing:3px;
    font-size:13px;
    text-transform:uppercase;
    color:#7a6a4a;
    z-index:6;
  }

  /* page-flip animation for spread prev/next */
  .flip-page{
    position:absolute;
    top:0;bottom:0;
    width:50%;
    padding:48px 44px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:var(--parchment);
    backface-visibility:hidden;
    box-shadow:0 0 26px rgba(0,0,0,.3);
    z-index:5;
    pointer-events:none;
  }
  .flip-page.right{
    right:0;
    transform-origin:left center;
    animation:flipNext .5s ease forwards;
  }
  .flip-page.left{
    left:0;
    transform-origin:right center;
    animation:flipPrev .5s ease forwards;
  }
  @keyframes flipNext{
    from{ transform:rotateY(0deg); }
    to{ transform:rotateY(-150deg); }
  }
  @keyframes flipPrev{
    from{ transform:rotateY(0deg); }
    to{ transform:rotateY(150deg); }
  }
  .proj-thumb{
    width:100%;
    aspect-ratio:16/10;
    border-radius:4px;
    border:2px solid var(--ink);
    background-color:#567;
    background-image:linear-gradient(135deg, rgba(255,255,255,.15), transparent);
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
    margin-top:20px;
    margin-bottom:16px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 14px rgba(0,0,0,.2);
  }
  .proj-thumb:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 10px 20px rgba(0,0,0,.3);
  }
  .proj-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
    color:var(--ink);
  }
  .proj-desc{
    font-size:14px;
    line-height:1.65;
    color:#5a4f3c;
    max-width:440px;
  }
  .spread-nav{
    position:absolute;
    bottom:16px;left:0;right:0;
    display:flex;
    justify-content:center;
    gap:16px;
    z-index:6;
  }
  .spread-nav button{
    background:transparent;
    border:none;
    font-size:22px;
    color:#7a6a4a;
    padding:4px 12px;
  }
  .spread-nav button:hover{ color:var(--accent); }
  .spread-nav button:disabled{ opacity:.25; cursor:default; }

  /* ---------- PROJECT DETAIL (overlay window) ---------- */
  #screen-project{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  #screen-project.open{
    opacity:1;
    pointer-events:auto;
  }
  .overlay-backdrop{
    position:absolute;
    inset:0;
    background:rgba(12,7,4,.72);
    backdrop-filter:blur(2px);
  }
  .project-window{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    /* aged paper look: stain blotches + faint fiber lines over a sepia base */
    background:
      radial-gradient(circle at 15% 20%, rgba(120,85,35,.10), transparent 35%),
      radial-gradient(circle at 85% 15%, rgba(120,85,35,.08), transparent 40%),
      radial-gradient(circle at 75% 85%, rgba(110,75,30,.10), transparent 45%),
      radial-gradient(circle at 25% 90%, rgba(110,75,30,.07), transparent 40%),
      repeating-linear-gradient(0deg, rgba(90,60,20,.03) 0 1px, transparent 1px 3px),
      linear-gradient(180deg,#f2e5c4,#e6d2a2 55%,#dcc48f);
    border-radius:4px;
    padding:40px 38px 34px;
    width:min(760px,90vw);
    max-height:88vh;
    overflow:auto;
    box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 50px rgba(110,75,25,.25), inset 0 0 3px rgba(70,45,15,.4);
    clip-path:polygon(0.0% 0.52%, 12.5% 0.24%, 25.0% 1.04%, 37.5% 0.12%, 50.0% 0.86%, 62.5% 0.59%, 75.0% 0.09%, 87.5% 0.81%, 100.0% 0.06%, 99.31% 0.0%, 99.89% 12.5%, 99.85% 25.0%, 99.32% 37.5%, 98.68% 50.0%, 99.8% 62.5%, 99.64% 75.0%, 99.0% 87.5%, 98.48% 100.0%, 100.0% 99.08%, 87.5% 99.37%, 75.0% 98.44%, 62.5% 99.93%, 50.0% 98.63%, 37.5% 99.54%, 25.0% 99.77%, 12.5% 99.81%, 0.0% 99.51%, 1.31% 100.0%, 0.29% 87.5%, 0.93% 75.0%, 1.02% 62.5%, 0.6% 50.0%, 0.88% 37.5%, 0.1% 25.0%, 0.1% 12.5%, 0.33% 0.0%);
    transform:scale(.92) translateY(16px);
    transition:transform .3s ease;
  }
  #screen-project.open .project-window{
    transform:scale(1) translateY(0);
  }
  .project-nav-top{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    pointer-events:none;
    z-index:5;
  }
  .project-navbtn{
    pointer-events:auto;
    width:38px;height:38px;
    border-radius:50%;
    background:rgba(243,233,199,.9);
    border:2px solid var(--ink);
    font-size:17px;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    transition:transform .15s ease, background .15s ease;
    flex-shrink:0;
  }
  .project-navbtn:hover{ background:#fff; transform:scale(1.08); }
  .overlay-close{
    position:absolute;
    top:12px;right:12px;
    width:32px;height:32px;
    border-radius:50%;
    background:var(--cream);
    border:2px solid var(--ink);
    font-size:18px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    transition:transform .15s ease;
    z-index:6;
  }
  .overlay-close:hover{ transform:scale(1.08); }
  .monitor{
    width:min(680px,80vw);
    background:#151515;
    border-radius:10px;
    padding:16px 16px 26px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .monitor::after{
    content:"";
    position:absolute;
    left:50%;bottom:-14px;
    transform:translateX(-50%);
    width:110px;height:14px;
    background:#0e0e0e;
    border-radius:0 0 6px 6px;
  }
  .monitor-screen{
    aspect-ratio:16/9;
    border-radius:4px;
    overflow:hidden;
    background-color:#456;
    background-image:linear-gradient(135deg, rgba(255,255,255,.12), transparent);
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .play-icon{
    width:0;height:0;
    border-top:20px solid transparent;
    border-bottom:20px solid transparent;
    border-left:32px solid rgba(255,255,255,.9);
    filter:drop-shadow(0 0 8px rgba(0,0,0,.4));
  }
  .gallery-strip{
    display:none;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    max-width:min(680px,80vw);
  }
  .gallery-thumb{
    width:64px;height:40px;
    border-radius:4px;
    border:2px solid rgba(43,33,24,.4);
    background-size:cover;
    background-position:center;
    background-color:#8a7a5c;
    cursor:pointer;
    opacity:.75;
    transition:opacity .15s ease, border-color .15s ease, transform .15s ease;
  }
  .gallery-thumb:hover{ opacity:1; transform:translateY(-2px); }
  .gallery-thumb.active{
    opacity:1;
    border-color:var(--accent);
  }
  .video-thumb{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .gallery-play{
    color:#fff;
    font-size:11px;
    text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .video-fallback{
    color:#f0e6c8;
    font-size:14px;
    text-align:center;
    text-decoration:underline;
    padding:0 20px;
  }
  .watch-link{
    position:absolute;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:11px;
    padding:5px 10px;
    border-radius:999px;
    text-decoration:none;
    z-index:2;
  }
  .watch-link:hover{ background:rgba(0,0,0,.85); }
  .project-info{
    text-align:center;
    max-width:640px;
  }
  .project-info h2{
    margin:0 0 10px;
    letter-spacing:1px;
  }
  .project-info p{
    font-size:14px;
    line-height:1.7;
    color:#4a4030;
  }
  .project-switch{
    display:flex;
    gap:14px;
  }

  /* ---------- DEVELOPER MODE ---------- */
  #devToggleBtn{
    position:fixed;
    right:18px;bottom:18px;
    z-index:2000;
    width:46px;height:46px;
    border-radius:50%;
    background:#222;
    color:#eee;
    border:2px solid #555;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.5);
    font-family:'Segoe UI',Arial,sans-serif;
  }
  #devToggleBtn:hover{ background:#333; }
  #devPanel{
    position:fixed;
    top:0;right:0;bottom:0;
    width:min(420px,92vw);
    background:#1c1c1e;
    color:#e8e8e8;
    z-index:1999;
    box-shadow:-8px 0 24px rgba(0,0,0,.5);
    transform:translateX(100%);
    transition:transform .28s ease;
    display:flex;
    flex-direction:column;
    font-family:'Segoe UI',Arial,sans-serif;
  }
  #devPanel.open{ transform:translateX(0); }
  .dev-header{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid #333;
  }
  .dev-header h2{
    font-size:15px;
    margin:0;
    letter-spacing:.5px;
  }
  .dev-header button{
    background:none;
    border:none;
    color:#aaa;
    font-size:20px;
    cursor:pointer;
  }
  .dev-body{
    flex:1;
    overflow-y:auto;
    padding:14px 18px 100px;
  }
  .dev-section{
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid #2c2c2e;
  }
  .dev-section h3{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#9a9a9a;
    margin:0 0 10px;
  }
  .dev-field{
    margin-bottom:10px;
  }
  .dev-field label{
    display:block;
    font-size:11.5px;
    color:#aaa;
    margin-bottom:4px;
  }
  .dev-field input[type=text],
  .dev-field textarea{
    width:100%;
    background:#2a2a2c;
    border:1px solid #444;
    color:#eee;
    border-radius:5px;
    padding:7px 9px;
    font-size:13px;
    font-family:inherit;
    resize:vertical;
  }
  .dev-field textarea{ min-height:52px; }
  .dev-field input[type=file]{
    font-size:12px;
    color:#ccc;
    width:100%;
  }
  .dev-field input[type=color]{
    width:44px;height:28px;
    border:1px solid #444;
    border-radius:4px;
    background:none;
    padding:0;

<body>
<div id="app">

  <!-- LANDING -->

    <div class="landing-slogan" id="landingSlogan">Decades Imagination, Magic Unfolded</div>

</div>

<!-- DEVELOPER MODE: add images / edit text without touching code -->
<button id="devToggleBtn" title="Developer mode">&#9881;</button>

  <div class="dev-header">
    <h2>Developer mode</h2>
    <button id="devCloseBtn">&times;</button>
  </div>
  <div class="dev-body" id="devBody"></div>
  <div class="dev-footer">
    <button id="devSaveBtn">Save &amp; apply</button>
    <button id="devExportBtn" class="secondary">Export JSON</button>
    <label class="secondary" for="devImportInput">Import JSON</label>

    <button id="devResetBtn" class="danger">Reset all</button>
  </div>

<script>
/* ================= default content ================= */
const DEFAULTS = {
  slogan: "Decades Imagination, Magic Unfolded",
  title: "DMT SHOWCASE",
  landingBg: null,
  mascotImg: null,
  introSlides: [
    "Welcome to the DMT Showcase — a collection of projects built by Digital Media Technology students across game development, animation, VR, and more.",
    "Every book on the shelf ahead represents a category of work. Pick one up to browse the projects inside.",
    "Ready to explore? Head to the library and click a spine to begin."
  ],
  categories: [
    { name: "Board Game", color: "#60241e", big: false, image: null },
    { name: "Audio Visual Language", color: "#95271d", big: false, image: null },
    { name: "2D Animation", color: "#b34a44", big: false, image: null },
    { name: "Game Development", color: "#2f2fe4", big: false, image: null },
    { name: "3D Modelling", color: "#e77b49", big: false, image: null },
    { name: "Virtual Reality (VR)", color: "#162e93", big: false, image: null },
    { name: "Embedded Game Development", color: "#1a1953", big: false, image: null },
    { name: "Non-Linear Editing (NLE)", color: "#60241e", big: false, image: null },
    { name: "3D Animation", color: "#95271d", big: false, image: null },
    { name: "Online Game Development", color: "#2f2fe4", big: false, image: null },
    { name: "Augmented Reality (AR)", color: "#162e93", big: false, image: null },
    { name: "Game Engine Design", color: "#1a1953", big: false, image: null },
    { name: "Final Year Project (FYP)", color: "#ffc349", big: true, image: null }
  ].map(cat => ({
    ...cat,
    projects: [1,2,3].map(n => ({
      name: `${cat.name} — Project ${n}`,
      desc: "Placeholder description of this student project. Replace with the real summary, tools used, and team credits.",
      videoUrl: null,
      gallery: []
    }))
  }))
};

/* ================= storage ================= */
const STORAGE_KEY = 'dmtShowcaseSiteData';
function cloneDefaults(){ return JSON.parse(JSON.stringify(DEFAULTS)); }
function loadSiteData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){ console.warn('Could not load saved data, using defaults', e); }
  return cloneDefaults();
}
function saveSiteData(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(siteData));
  } catch(e){
    alert('Could not save — your browser storage may be full. Try smaller images.');
  }
}

let siteData = loadSiteData();

/* ================= state ================= */
let introIndex = 0;
let currentCat = null;
let spreadStart = 0;
let currentProjectRef = null;

const $ = id => document.getElementById(id);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* ================= apply site-wide basics ================= */
function applyBasics(){
  $('landingSlogan').textContent = siteData.slogan;
  $('landingTitle').textContent = siteData.title;
  const landing = $('screen-landing');
  if (siteData.landingBg){
    landing.style.backgroundImage =
      `linear-gradient(rgba(10,10,5,.35), rgba(10,10,5,.55)), url('${siteData.landingBg}')`;
  } else {
    landing.style.backgroundImage = '';
  }
  const mascotBox = $('mascotBox');
  if (siteData.mascotImg){
    mascotBox.innerHTML = `<img src="${siteData.mascotImg}" alt="mascot">`;
  } else if (!mascotBox.querySelector('.hat')){
    mascotBox.innerHTML = `
      <div class="hat"></div>
      <div class="head">
        <div class="ear l"></div>
        <div class="ear r"></div>
        <div class="visor"></div>
      </div>
      <div class="body">
        <div class="arm l"></div>
        <div class="arm r"></div>
        <div class="core"></div>
      </div>`;
  }
}

/* ---------------- landing ---------------- */
$('enterBtn').addEventListener('click', () => {
  introIndex = 0;
  renderIntro();
  showScreen('screen-intro');
});

/* ---------------- intro ---------------- */
function renderIntro(){
  $('introBody').textContent = siteData.introSlides[introIndex];
  const dots = $('introDots');
  dots.innerHTML = '';
  siteData.introSlides.forEach((_, i) => {
    const d = document.createElement('span');
    if (i === introIndex) d.classList.add('active');
    dots.appendChild(d);
  });
  $('nextBtn').textContent = introIndex === siteData.introSlides.length - 1 ? 'ENTER LIBRARY' : 'NEXT';
}
$('introBack').addEventListener('click', () => {
  showScreen('screen-landing');
});
$('nextBtn').addEventListener('click', () => {
  if (introIndex < siteData.introSlides.length - 1){
    introIndex++;
    renderIntro();
  } else {
    renderShelf();
    showScreen('screen-shelf');
  }
});

/* ---------------- shelf ---------------- */
function chunkIntoPlatforms(list){
  // groups of 4-5 books per shelf platform
  const platforms = [];
  let i = 0;
  while (i < list.length){
    const remaining = list.length - i;
    let size = remaining <= 5 ? remaining : (Math.random() < 0.5 ? 4 : 5);
    if (remaining - size < 3 && remaining - size > 0) size = remaining; // avoid a tiny leftover platform
    platforms.push(list.slice(i, i + size));
    i += size;
  }
  return platforms;
}

function buildPlatform(group){
  const platform = document.createElement('div');
  platform.className = 'shelf-platform';
  group.forEach(({ cat, index }) => {
    const b = document.createElement('div');
    b.className = 'book';
    b.textContent = cat.name;
    b.dataset.catIndex = index;
    if (cat.image){
      // image spine, with color as a tinted backdrop while it loads
      b.style.background = `linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)), ${cat.color} url('${cat.image}') center/cover no-repeat`;
    } else {
      b.style.background = cat.color;
    }
    if (cat.big){
      // Final Year Project stands out: taller, wider, upright
      b.style.width = '82px';
      b.style.height = '260px';
      b.style.fontSize = '15px';
      b.style.color = '#4a3410';
      b.style.textShadow = 'none';
      b.style.setProperty('--tilt', '0deg');
    } else {
      // vary height so tops look uneven, like real books on a shelf
      b.style.height = (170 + Math.round(Math.random() * 40)) + 'px';
      // slight random lean, like a book left slightly askew
      b.style.setProperty('--tilt', (Math.random() * 8 - 4).toFixed(1) + 'deg');
    }
    // random gap around each book for uneven spacing (tighter on narrow phones
    // so a platform's books don't overflow the viewport width)
    const narrow = window.innerWidth < 480;
    const gapMax = narrow ? 10 : 28;
    const gapBase = narrow ? 2 : 4;
    b.style.marginLeft = (gapBase + Math.round(Math.random() * gapMax)) + 'px';
    b.style.marginRight = (gapBase + Math.round(Math.random() * gapMax)) + 'px';
    platform.appendChild(b);
  });
  return platform;
}
function attachBookHandlers(container){
  container.querySelectorAll('.book').forEach(b => {
    const idx = parseInt(b.dataset.catIndex, 10);
    b.addEventListener('click', () => openCategory(idx));
  });
}

function renderShelf(){
  const stack = $('bookcaseStack');
  stack.innerHTML = '';
  let globalIndex = 0;
  const platforms = chunkIntoPlatforms(siteData.categories).map(group =>
    group.map(cat => ({ cat, index: globalIndex++ }))
  );

  // build one real copy (randomized), then clone it for a second, identical
  // copy right after — scrolling past the end lands you back at a pixel-perfect
  // match for the start, so the loop feels endless
  const loopStart = document.createDocumentFragment();
  platforms.forEach(group => loopStart.appendChild(buildPlatform(group)));
  stack.appendChild(loopStart);
  attachBookHandlers(stack);

  const clone = stack.cloneNode(true);
  const newPlatforms = Array.from(clone.children);
  newPlatforms.forEach(p => {
    stack.appendChild(p);
    attachBookHandlers(p);
  });

  setupShelfSlider();
}

function setupShelfSlider(){
  const viewport = document.querySelector('.bookcase-viewport');
  const stack = $('bookcaseStack');
  // wait a frame so layout/heights are settled
  requestAnimationFrame(() => {
    const loopHeight = stack.scrollHeight / 2;
    let offset = 0;
    stack.style.transform = 'translateY(0px)';

    const moveTo = (value) => {
      // wrap around the loop point so scrolling past the bottom
      // seamlessly continues from the (identical) top copy
      offset = ((value % loopHeight) + loopHeight) % loopHeight;
      stack.style.transform = `translateY(-${offset}px)`;
    };

    // mouse wheel / trackpad scrolls the shelf
    viewport.onwheel = (e) => {
      e.preventDefault();
      moveTo(offset + e.deltaY);
    };
  });
}
$('shelfBack').addEventListener('click', () => {
  showScreen('screen-intro');
});

/* ---------------- category spread (overlay window) ---------------- */
function openCategory(i){
  currentCat = i;
  spreadStart = 0;
  renderSpread();
  $('screen-category').classList.add('open');
}
function closeCategory(){
  closeProject();
  $('screen-category').classList.remove('open');
}
function renderSpread(){
  const cat = siteData.categories[currentCat];
  $('catTitle').textContent = cat.name;
  const left = cat.projects[spreadStart];
  const right = cat.projects[spreadStart + 1];
  $('pageLeft').innerHTML = pageHTML(left);
  $('pageRight').innerHTML = right ? pageHTML(right) : '';
  $('spreadPrev').disabled = spreadStart === 0;
  $('spreadNext').disabled = spreadStart + 2 >= cat.projects.length;

  document.querySelectorAll('.proj-thumb').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx, 10);
      openProject(currentCat, idx);
    });
  });
}
function pageHTML(proj){
  if (!proj) return '';
  const cat = siteData.categories[currentCat];
  const idx = cat.projects.indexOf(proj);
  const cover = (proj.gallery && proj.gallery.length ? proj.gallery[0] : null)
    || (proj.videoUrl ? videoThumbUrl(proj.videoUrl) : null);
  // data URLs / remote thumbnail URLs need url(...) wrapping in CSS; plain
  // hex colors don't — build the right background style for whichever we have
  const style = cover
    ? `background-image:linear-gradient(135deg, rgba(255,255,255,.15), transparent), url('${cover}')`
    : `background-color:${cat.color}`;
  const showPlay = !cover || proj.videoUrl;
  return `
    <div class="proj-thumb" style="${style}" data-idx="${idx}">
      ${showPlay ? '<div class="play-icon"></div>' : ''}
    </div>
    <div class="proj-name">${proj.name}</div>
    <div class="proj-desc">${proj.desc}</div>
  `;
}
function flipSpread(direction){
  const spreadEl = document.querySelector('.book-spread');
  const isNext = direction === 'next';
  const sourceEl = isNext ? $('pageRight') : $('pageLeft');
  if (!sourceEl.innerHTML.trim()) return; // nothing on that page to flip

  // snapshot the current page as a floating clone, then swap the real
  // content underneath immediately so the new page is revealed as it turns
  const clone = document.createElement('div');
  clone.className = 'flip-page ' + (isNext ? 'right' : 'left');
  clone.innerHTML = sourceEl.innerHTML;
  spreadEl.appendChild(clone);
  clone.addEventListener('animationend', () => clone.remove(), { once:true });

  spreadStart += isNext ? 2 : -2;
  renderSpread();
}
$('spreadPrev').addEventListener('click', () => flipSpread('prev'));
$('spreadNext').addEventListener('click', () => flipSpread('next'));
$('categoryClose').addEventListener('click', closeCategory);
$('categoryBackdrop').addEventListener('click', closeCategory);

/* ---------------- project detail (overlay window) ---------------- */
let galleryIndex = 0;
function openProject(catIdx, projIdx){
  currentProjectRef = { catIdx, projIdx };
  galleryIndex = 0;
  renderProject();
  $('screen-project').classList.add('open');
}
function renderProject(){
  const { catIdx, projIdx } = currentProjectRef;
  const cat = siteData.categories[catIdx];
  const projects = cat.projects;
  const proj = projects[projIdx];
  const items = getMediaItems(proj);
  if (galleryIndex >= items.length) galleryIndex = 0;
  const current = items[galleryIndex] || null;
  const screenEl = $('projectScreen');

  // clear anything injected on a previous render (iframe or fallback link)
  const oldFrame = screenEl.querySelector('iframe');
  if (oldFrame) oldFrame.remove();
  const oldFallback = screenEl.querySelector('.video-fallback');
  if (oldFallback) oldFallback.remove();
  const oldWatchLink = screenEl.querySelector('.watch-link');
  if (oldWatchLink) oldWatchLink.remove();

  if (current && current.type === 'video'){
    // show the video's own thumbnail behind everything first, so there's
    // always something visible even if the embed itself fails to render
    // (e.g. blocked when opened via a local file:// page instead of a server)
    const thumb = videoThumbUrl(current.url);
    if (thumb){
      screenEl.style.backgroundImage = `url('${thumb}')`;
      screenEl.style.backgroundColor = '#000';
    } else {
      screenEl.style.backgroundImage = 'none';
      screenEl.style.backgroundColor = '#000';
    }
    screenEl.querySelector('.play-icon').style.display = 'none';
    const embed = videoEmbedUrl(current.url);
    if (embed){
      const iframe = document.createElement('iframe');
      iframe.src = embed;
      iframe.style.cssText = 'width:100%;height:100%;border:0;border-radius:4px;';
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
      iframe.allowFullscreen = true;
      screenEl.appendChild(iframe);
      // always-visible fallback link too — if the embed is blocked (common
      // when the page is opened via file:// instead of a real server) this
      // is the guaranteed way to actually watch it
      const watchLink = document.createElement('a');
      watchLink.className = 'watch-link';
      watchLink.href = current.url;
      watchLink.target = '_blank';
      watchLink.rel = 'noopener';
      watchLink.textContent = 'Watch on YouTube/Vimeo ↗';
      screenEl.appendChild(watchLink);
    } else {
      // couldn't recognize the link as a YouTube/Vimeo video — embedding the
      // raw page would just fail (YouTube/Vimeo block framing non-embed
      // pages), so link out instead of showing a broken blank frame
      const fallback = document.createElement('a');
      fallback.className = 'video-fallback';
      fallback.href = current.url;
      fallback.target = '_blank';
      fallback.rel = 'noopener';
      fallback.textContent = 'Link not recognized as YouTube/Vimeo — open video ↗';
      screenEl.appendChild(fallback);
    }
  } else if (current && current.type === 'image'){
    screenEl.style.backgroundImage = `linear-gradient(135deg, rgba(255,255,255,.12), transparent), url('${current.src}')`;
    screenEl.style.backgroundColor = '';
    screenEl.querySelector('.play-icon').style.display = 'none';
  } else {
    screenEl.style.backgroundImage = 'linear-gradient(135deg, rgba(255,255,255,.12), transparent)';
    screenEl.style.backgroundColor = cat.color;
    screenEl.querySelector('.play-icon').style.display = 'block';
  }

  $('projectTitle').textContent = proj.name;
  $('projectDesc').textContent = proj.desc + " (Full write-up, credits, and media go here.)";
  const multi = projects.length > 1;
  $('projectPrev').style.display = multi ? 'flex' : 'none';
  $('projectNext').style.display = multi ? 'flex' : 'none';
  renderGalleryStrip(items);
}
function renderGalleryStrip(items){
  const strip = $('galleryStrip');
  if (!items || items.length < 2){
    strip.innerHTML = '';
    strip.style.display = 'none';
    return;
  }
  strip.style.display = 'flex';
  strip.innerHTML = items.map((item, i) => {
    const active = i === galleryIndex ? ' active' : '';
    if (item.type === 'video'){
      const thumb = videoThumbUrl(item.url);
      const style = thumb ? `background-image:url('${thumb}')` : 'background-color:#222';
      return `<div class="gallery-thumb video-thumb${active}" data-i="${i}" style="${style}"><span class="gallery-play">&#9654;</span></div>`;
    }
    return `<div class="gallery-thumb${active}" data-i="${i}" style="background-image:url('${item.src}')"></div>`;
  }).join('');
  strip.querySelectorAll('.gallery-thumb').forEach(el => {
    el.addEventListener('click', () => {
      galleryIndex = parseInt(el.dataset.i, 10);
      renderProject();
    });
  });
}
function goToProject(delta){
  const { catIdx, projIdx } = currentProjectRef;
  const projects = siteData.categories[catIdx].projects;
  // wraps around so you can keep browsing without going back to the book
  const nextIdx = (projIdx + delta + projects.length) % projects.length;
  currentProjectRef = { catIdx, projIdx: nextIdx };
  galleryIndex = 0;
  renderProject();
}
function closeProject(){
  $('screen-project').classList.remove('open');
}
$('projectClose').addEventListener('click', closeProject);
$('projectBackdrop').addEventListener('click', closeProject);
$('projectPrev').addEventListener('click', () => goToProject(-1));
$('projectNext').addEventListener('click', () => goToProject(1));
document.addEventListener('keydown', (e) => {
  if ($('devPanel').classList.contains('open')) return;
  if ($('screen-project').classList.contains('open')){
    if (e.key === 'Escape') closeProject();
    else if (e.key === 'ArrowRight') goToProject(1);
    else if (e.key === 'ArrowLeft') goToProject(-1);
    return;
  }
  if (e.key === 'Escape' && $('screen-category').classList.contains('open')) closeCategory();
});

/* ---------------- video link helpers (YouTube / Vimeo) ---------------- */
function parseYouTubeId(url){
  if (!url) return null;
  // handles watch?v=, youtu.be/, embed/, shorts/, live/, and m./music. subdomains,
  // regardless of where "v=ID" or the path segment falls in the URL
  let m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if (m) return m[1];
  m = url.match(/[?&]v=([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function parseVimeoId(url){
  if (!url) return null;
  const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : null;
}
function videoEmbedUrl(url){
  const yt = parseYouTubeId(url);
  // rel=0 keeps "related videos" to the same channel only, modestbranding
  // trims the YouTube logo, iv_load_policy=3 hides annotation callouts
  if (yt) return `https://www.youtube.com/embed/${yt}?rel=0&modestbranding=1&iv_load_policy=3`;
  const vm = parseVimeoId(url);
  // title/byline/portrait=0 strips Vimeo's title bar, author name, and avatar overlay
  if (vm) return `https://player.vimeo.com/video/${vm}?title=0&byline=0&portrait=0`;
  return null;
}
function videoThumbUrl(url){
  const yt = parseYouTubeId(url);
  if (yt) return `https://img.youtube.com/vi/${yt}/hqdefault.jpg`;
  return null; // Vimeo thumbnails need an API call — falls back to a generic tile
}
function getMediaItems(proj){
  const items = [];
  if (proj.videoUrl) items.push({ type: 'video', url: proj.videoUrl });
  (proj.gallery || []).forEach(src => items.push({ type: 'image', src }));
  return items;
}

/* ================= developer mode ================= */
function fileToDataURL(file, maxDim, quality){
  maxDim = maxDim || 900;
  quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function escapeHTML(s){
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function escapeAttr(s){
  return String(s).replace(/"/g, '&quot;');
}

function wireDevPanel(){
  // collapsible category blocks
  document.querySelectorAll('.dev-cat-head').forEach(head => {
    head.addEventListener('click', () => head.closest('.dev-cat').classList.toggle('open'));
  });

  $('devSlogan').addEventListener('input', e => { siteData.slogan = e.target.value; });
  $('devTitle').addEventListener('input', e => { siteData.title = e.target.value; });

  document.querySelectorAll('.devSlideText').forEach(el => {
    el.addEventListener('input', e => {
      siteData.introSlides[parseInt(e.target.dataset.slide, 10)] = e.target.value;
    });
  });

  $('devLandingFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    siteData.landingBg = await fileToDataURL(file, 1600, 0.8);
    $('devLandingPreview').style.backgroundImage = `url('${siteData.landingBg}')`;
    $('devLandingPreview').textContent = '';
  });
  $('devLandingClear').addEventListener('click', () => {
    siteData.landingBg = null;
    $('devLandingPreview').style.backgroundImage = '';
    $('devLandingPreview').textContent = 'No image set';
  });

  $('devMascotFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    siteData.mascotImg = await fileToDataURL(file, 500, 0.85);
    $('devMascotPreview').style.backgroundImage = `url('${siteData.mascotImg}')`;
    $('devMascotPreview').textContent = '';
  });
  $('devMascotClear').addEventListener('click', () => {
    siteData.mascotImg = null;
    $('devMascotPreview').style.backgroundImage = '';
    $('devMascotPreview').textContent = 'No image set';
  });

  document.querySelectorAll('.devCatName').forEach(el => {
    el.addEventListener('input', e => {
      siteData.categories[parseInt(e.target.dataset.cat, 10)].name = e.target.value;
    });
  });
  document.querySelectorAll('.devCatColor').forEach(el => {
    el.addEventListener('input', e => {
      siteData.categories[parseInt(e.target.dataset.cat, 10)].color = e.target.value;
    });
  });
  document.querySelectorAll('.devCatFile').forEach(el => {
    el.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const ci = parseInt(e.target.dataset.cat, 10);
      const dataUrl = await fileToDataURL(file, 400, 0.85);
      siteData.categories[ci].image = dataUrl;
      const preview = document.querySelector(`[data-cat-preview="${ci}"]`);
      preview.style.backgroundImage = `url('${dataUrl}')`;
      preview.textContent = '';
    });
  });
  document.querySelectorAll('.devCatClear').forEach(el => {
    el.addEventListener('click', (e) => {
      const ci = parseInt(e.target.dataset.cat, 10);
      siteData.categories[ci].image = null;
      const preview = document.querySelector(`[data-cat-preview="${ci}"]`);
      preview.style.backgroundImage = '';
      preview.textContent = 'No image set';
    });
  });

  document.querySelectorAll('.devProjName').forEach(el => {
    el.addEventListener('input', e => {
      const ci = parseInt(e.target.dataset.cat, 10), pi = parseInt(e.target.dataset.proj, 10);
      siteData.categories[ci].projects[pi].name = e.target.value;
    });
  });
  document.querySelectorAll('.devProjDesc').forEach(el => {
    el.addEventListener('input', e => {
      const ci = parseInt(e.target.dataset.cat, 10), pi = parseInt(e.target.dataset.proj, 10);
      siteData.categories[ci].projects[pi].desc = e.target.value;
    });
  });
  document.querySelectorAll('.devProjVideo').forEach(el => {
    el.addEventListener('input', e => {
      const ci = parseInt(e.target.dataset.cat, 10), pi = parseInt(e.target.dataset.proj, 10);
      siteData.categories[ci].projects[pi].videoUrl = e.target.value.trim() || null;
    });
  });
  document.querySelectorAll('.devProjFiles').forEach(el => {
    el.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      const ci = parseInt(e.target.dataset.cat, 10), pi = parseInt(e.target.dataset.proj, 10);
      for (const file of files){
        const dataUrl = await fileToDataURL(file, 1000, 0.8);
        siteData.categories[ci].projects[pi].gallery.push(dataUrl);
      }
      refreshGalleryList(ci, pi);
      e.target.value = '';
    });
  });
  wireGalleryRemoveButtons();
}

function galleryListHTML(ci, pi){
  const gallery = siteData.categories[ci].projects[pi].gallery;
  if (!gallery.length) return '<div class="dev-gallery-empty">No screenshots added yet</div>';
  return gallery.map((src, gi) => `
    <div class="dev-gallery-item" style="background-image:url('${src}')">
      <button class="dev-gallery-remove" data-cat="${ci}" data-proj="${pi}" data-g="${gi}">&times;</button>
    </div>
  `).join('');
}
function refreshGalleryList(ci, pi){
  const listEl = document.querySelector(`[data-gallery-list="${ci}-${pi}"]`);
  if (listEl) listEl.innerHTML = galleryListHTML(ci, pi);
  wireGalleryRemoveButtons();
}
function wireGalleryRemoveButtons(){
  document.querySelectorAll('.dev-gallery-remove').forEach(btn => {
    btn.onclick = (e) => {
      const ci = parseInt(e.target.dataset.cat, 10), pi = parseInt(e.target.dataset.proj, 10), gi = parseInt(e.target.dataset.g, 10);
      siteData.categories[ci].projects[pi].gallery.splice(gi, 1);
      refreshGalleryList(ci, pi);
    };
  });
}

function applyAndRerenderEverything(){
  applyBasics();
  renderShelf();
  if (currentCat !== null) renderSpread();
  if (currentProjectRef) renderProject();
}

$('devToggleBtn').addEventListener('click', () => {
  renderDevPanel();
  $('devPanel').classList.add('open');
});

$('devSaveBtn').addEventListener('click', () => {
  saveSiteData();
  applyAndRerenderEverything();
  $('devSaveBtn').textContent = 'Saved!';
  setTimeout(() => { $('devSaveBtn').textContent = 'Save & apply'; }, 1200);
});
$('devExportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(siteData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dmt-showcase-data.json';
  a.click();
  URL.revokeObjectURL(url);
});
$('devImportInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    siteData = parsed;
    saveSiteData();
    renderDevPanel();
    applyAndRerenderEverything();
    alert('Imported! Changes are applied.');
  } catch(err){
    alert('That file could not be read as valid site data JSON.');
  }
  e.target.value = '';
});
$('devResetBtn').addEventListener('click', () => {
  if (!confirm('Reset everything back to the default placeholder content? This clears all your saved edits in this browser.')) return;
  siteData = cloneDefaults();
  localStorage.removeItem(STORAGE_KEY);
  renderDevPanel();
  applyAndRerenderEverything();
});

/* ================= init ================= */
applyBasics();
