<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMT Showcase</title>
<style>
  :root{
    --cream:#f3e9d8;
    --parchment:#efe2c8;
    --wood:#5b3a24;
    --wood-dark:#3d2717;
    --ink:#2b2118;
    --accent:#c1442e;
    --gold:#b8933f;
    --shadow: 0 12px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Georgia','Times New Roman',serif;
    color:var(--ink);
    background:#111;
    overflow:hidden;
  }
  #app{
    position:relative;
    width:100vw;height:100vh;
    overflow:hidden;
  }
  .screen{
    position:absolute;
    inset:0;
    display:none;
    opacity:0;
    transform:scale(.96);
    transition:opacity .5s ease, transform .5s ease;
  }
  .screen.active{
    display:flex;
    opacity:1;
    transform:scale(1);
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    outline:none;
  }
  .btn{
    background:var(--cream);
    border:2px solid var(--ink);
    color:var(--ink);
    padding:14px 42px;
    font-size:18px;
    letter-spacing:2px;
    border-radius:4px;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{
    transform:translateY(-3px);
    background:#fff;
    box-shadow:0 16px 34px rgba(0,0,0,.5);
  }
  .btn:active{ transform:translateY(0); }

  .back-btn{
    position:absolute;
    top:24px;left:24px;
    z-index:20;
    padding:10px 22px;
    font-size:14px;
    letter-spacing:1px;
  }

  /* ---------- LANDING ---------- */
  #screen-landing{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    /* To use a real background photo/art: drop the image next to index.html
       (e.g. an "images" folder) and uncomment the url(...) line below,
       pointing it at your file. The gradients on top keep the text readable
       over any image. */
    background:
      linear-gradient(rgba(10,10,5,.35), rgba(10,10,5,.55)),
      radial-gradient(ellipse at 50% 20%, rgba(255,225,150,.25), transparent 55%),
      linear-gradient(180deg,#1c2b17 0%, #172318 40%, #0e160f 100%)
      /* , url('images/landing-bg.jpg') center/cover no-repeat */
      ;
    background-blend-mode:normal;
    text-align:center;
  }
  .landing-glow{
    position:absolute;
    inset:0;
    background:
      repeating-radial-gradient(circle at 15% 30%, rgba(120,40,40,.18) 0 2px, transparent 2px 60px),
      repeating-radial-gradient(circle at 85% 70%, rgba(60,90,50,.18) 0 2px, transparent 2px 70px);
    opacity:.6;
    pointer-events:none;
  }
  .landing-slogan{
    color:#f0e6c8;
    letter-spacing:6px;
    font-size:14px;
    text-transform:uppercase;
    margin-bottom:10px;
    opacity:.85;
    z-index:2;
  }
  .landing-title{
    color:#fffaf0;
    font-size:clamp(42px,8vw,88px);
    letter-spacing:6px;
    text-shadow:0 4px 24px rgba(0,0,0,.6), 0 0 40px rgba(255,220,150,.25);
    margin:0 0 46px 0;
    z-index:2;
  }
  #enterBtn{ z-index:2; }

  /* ---------- INTRO (mascot) ---------- */
  #screen-intro{
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg,#fdfaf3,#f2e9d8);
  }
  .intro-wrap{
    display:flex;
    align-items:center;
    gap:60px;
    max-width:900px;
    width:90%;
  }
  .mascot{
    width:180px;height:220px;
    flex-shrink:0;
    position:relative;
    animation:bob 2.4s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
  }
  .mascot .hat{
    width:0;height:0;
    border-left:34px solid transparent;
    border-right:34px solid transparent;
    border-bottom:56px solid var(--accent);
    margin:0 auto;
    position:relative;
  }
  .mascot .hat::after{
    content:"";
    position:absolute;
    bottom:-6px;left:-40px;
    width:80px;height:10px;
    background:var(--gold);
    border-radius:4px;
  }
  .mascot .head{
    width:120px;height:100px;
    background:#e9e9ec;
    border:3px solid var(--ink);
    border-radius:38% 38% 45% 45%;
    margin:-4px auto 0;
    position:relative;
  }
  .mascot .visor{
    position:absolute;
    top:32px;left:50%;
    transform:translateX(-50%);
    width:78px;height:32px;
    background:#233043;
    border-radius:16px;
    box-shadow:inset 0 0 0 2px #4a6a9c;
  }
  .mascot .ear{
    position:absolute;
    top:6px;
    width:16px;height:22px;
    background:#e9e9ec;
    border:3px solid var(--ink);
    border-radius:8px 8px 0 0;
  }
  .mascot .ear.l{ left:-6px; } .mascot .ear.r{ right:-6px; }
  .mascot .body{
    width:110px;height:70px;
    background:#e9e9ec;
    border:3px solid var(--ink);
    border-radius:20px;
    margin:-6px auto 0;
    position:relative;
  }
  .mascot .core{
    position:absolute;
    top:22px;left:50%;
    transform:translateX(-50%);
    width:20px;height:20px;
    background:var(--gold);
    border-radius:50%;
    border:2px solid var(--ink);
  }
  .mascot .arm{
    position:absolute;
    top:14px;
    width:14px;height:44px;
    background:#3a7bd5;
    border:3px solid var(--ink);
    border-radius:10px;
  }
  .mascot .arm.l{ left:-16px; transform:rotate(-8deg); }
  .mascot .arm.r{ right:-16px; transform:rotate(8deg); }

  .intro-text{
    flex:1;
  }
  .intro-label{
    letter-spacing:4px;
    font-size:13px;
    color:var(--accent);
    margin-bottom:10px;
    text-transform:uppercase;
    font-weight:bold;
  }
  .intro-body{
    font-size:16px;
    line-height:1.7;
    color:#3a3226;
    margin-bottom:26px;
    min-height:120px;
  }
  .intro-dots{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .intro-dots span{
    width:8px;height:8px;border-radius:50%;
    background:#d8cbaa;
  }
  .intro-dots span.active{ background:var(--accent); }

  /* ---------- SHELF (library) ---------- */
  #screen-shelf{
    flex-direction:column;
    align-items:center;
    background:linear-gradient(180deg,#2a1c12,#1c120b);
    padding:20px 20px;
  }
  .shelf-title{
    flex-shrink:0;
    color:#f3e6c8;
    letter-spacing:4px;
    font-size:15px;
    text-transform:uppercase;
    margin-bottom:16px;
    text-align:center;
  }
  .bookcase-wrap{
    display:flex;
    align-items:stretch;
    gap:18px;
    flex:1;
    min-height:0;
    width:100%;
    justify-content:center;
  }
  .bookcase-viewport{
    width:min(560px,80vw);
    height:100%;
    overflow:hidden;
    position:relative;
  }
  .bookcase-stack{
    display:flex;
    flex-direction:column;
    will-change:transform;
  }
  .shelf-platform{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:0;
    min-height:210px;
    padding:0 10px 0;
    border-bottom:14px solid var(--wood);
    box-shadow:0 18px 20px -12px rgba(0,0,0,.6);
    margin-bottom:36px;
  }
  .book{
    --tilt:0deg;
    width:54px;
    border:2px solid var(--ink);
    border-radius:4px 4px 0 0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px 6px;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-size:13px;
    box-shadow:0 3px 4px rgba(0,0,0,.35);
    letter-spacing:1px;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
    transition:transform .2s ease, box-shadow .2s ease;
    transform:rotate(var(--tilt));
    transform-origin:bottom center;
    flex-shrink:0;
    background-size:cover;
    background-position:center;
  }
  .book:hover{
    transform:rotate(var(--tilt)) translateY(-16px);
    box-shadow:0 20px 20px -10px rgba(0,0,0,.5);
  }
  .vslider-wrap{
    width:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:6px;
    flex-shrink:0;
  }
  .vslider-wrap span{
    color:#c9a86a;
    font-size:16px;
    user-select:none;
  }
  .vslider-track{
    width:30px;
    height:400px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #shelfSlider{
    width:396px;
    -webkit-appearance:none;
    appearance:none;
    height:6px;
    border-radius:3px;
    background:linear-gradient(90deg,#4a2f1c,#6b4326);
    outline:none;
    transform:rotate(90deg);
  }
  #shelfSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:20px;height:20px;
    border-radius:50%;
    background:var(--gold);
    border:2px solid #2b1c10;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  #shelfSlider::-moz-range-thumb{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--gold);
    border:2px solid #2b1c10;
    cursor:pointer;
  }

  /* ---------- CATEGORY SPREAD (overlay window on top of the shelf) ---------- */
  #screen-category{
    position:fixed;
    inset:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  #screen-category.open{
    opacity:1;
    pointer-events:auto;
  }
  .book-spread{
    display:flex;
    background:var(--parchment);
    border-radius:6px;
    box-shadow:0 30px 70px rgba(0,0,0,.6);
    width:min(920px,92vw);
    min-height:520px;
    position:relative;
    overflow:hidden;
    transform:scale(.92) translateY(16px);
    transition:transform .3s ease;
    perspective:1800px;
  }
  #screen-category.open .book-spread{
    transform:scale(1) translateY(0);
  }
  .book-spread::before{
    content:"";
    position:absolute;
    top:0;bottom:0;left:50%;
    width:2px;
    background:rgba(0,0,0,.15);
    box-shadow:0 0 12px rgba(0,0,0,.15);
    z-index:1;
  }
  .page{
    flex:1;
    padding:38px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .cat-title{
    position:absolute;
    top:16px;left:0;right:0;
    text-align:center;
    letter-spacing:3px;
    font-size:13px;
    text-transform:uppercase;
    color:#7a6a4a;
    z-index:6;
  }

  /* page-flip animation for spread prev/next */
  .flip-page{
    position:absolute;
    top:0;bottom:0;
    width:50%;
    padding:38px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    background:var(--parchment);
    backface-visibility:hidden;
    box-shadow:0 0 26px rgba(0,0,0,.3);
    z-index:5;
    pointer-events:none;
  }
  .flip-page.right{
    right:0;
    transform-origin:left center;
    animation:flipNext .5s ease forwards;
  }
  .flip-page.left{
    left:0;
    transform-origin:right center;
    animation:flipPrev .5s ease forwards;
  }
  @keyframes flipNext{
    from{ transform:rotateY(0deg); }
    to{ transform:rotateY(-150deg); }
  }
  @keyframes flipPrev{
    from{ transform:rotateY(0deg); }
    to{ transform:rotateY(150deg); }
  }
  .proj-thumb{
    width:100%;
    aspect-ratio:16/10;
    border-radius:4px;
    border:2px solid var(--ink);
    background:
      linear-gradient(135deg, rgba(255,255,255,.15), transparent),
      var(--thumb-color, #567);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
    margin-top:20px;
    margin-bottom:16px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 14px rgba(0,0,0,.2);
  }
  .proj-thumb:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 10px 20px rgba(0,0,0,.3);
  }
  .proj-name{
    font-size:15px;
    font-weight:bold;
    margin-bottom:8px;
    color:var(--ink);
  }
  .proj-desc{
    font-size:12.5px;
    line-height:1.6;
    color:#5a4f3c;
  }
  .spread-nav{
    position:absolute;
    bottom:16px;left:0;right:0;
    display:flex;
    justify-content:center;
    gap:16px;
    z-index:6;
  }
  .spread-nav button{
    background:transparent;
    border:none;
    font-size:22px;
    color:#7a6a4a;
    padding:4px 12px;
  }
  .spread-nav button:hover{ color:var(--accent); }
  .spread-nav button:disabled{ opacity:.25; cursor:default; }

  /* ---------- PROJECT DETAIL (overlay window) ---------- */
  #screen-project{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  #screen-project.open{
    opacity:1;
    pointer-events:auto;
  }
  .overlay-backdrop{
    position:absolute;
    inset:0;
    background:rgba(12,7,4,.72);
    backdrop-filter:blur(2px);
  }
  .project-window{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    /* aged paper look: stain blotches + faint fiber lines over a sepia base */
    background:
      radial-gradient(circle at 15% 20%, rgba(120,85,35,.10), transparent 35%),
      radial-gradient(circle at 85% 15%, rgba(120,85,35,.08), transparent 40%),
      radial-gradient(circle at 75% 85%, rgba(110,75,30,.10), transparent 45%),
      radial-gradient(circle at 25% 90%, rgba(110,75,30,.07), transparent 40%),
      repeating-linear-gradient(0deg, rgba(90,60,20,.03) 0 1px, transparent 1px 3px),
      linear-gradient(180deg,#f2e5c4,#e6d2a2 55%,#dcc48f);
    border-radius:4px;
    padding:40px 38px 34px;
    width:min(760px,90vw);
    max-height:88vh;
    overflow:auto;
    box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 50px rgba(110,75,25,.25), inset 0 0 3px rgba(70,45,15,.4);
    clip-path:polygon(0.0% 0.52%, 12.5% 0.24%, 25.0% 1.04%, 37.5% 0.12%, 50.0% 0.86%, 62.5% 0.59%, 75.0% 0.09%, 87.5% 0.81%, 100.0% 0.06%, 99.31% 0.0%, 99.89% 12.5%, 99.85% 25.0%, 99.32% 37.5%, 98.68% 50.0%, 99.8% 62.5%, 99.64% 75.0%, 99.0% 87.5%, 98.48% 100.0%, 100.0% 99.08%, 87.5% 99.37%, 75.0% 98.44%, 62.5% 99.93%, 50.0% 98.63%, 37.5% 99.54%, 25.0% 99.77%, 12.5% 99.81%, 0.0% 99.51%, 1.31% 100.0%, 0.29% 87.5%, 0.93% 75.0%, 1.02% 62.5%, 0.6% 50.0%, 0.88% 37.5%, 0.1% 25.0%, 0.1% 12.5%, 0.33% 0.0%);
    transform:scale(.92) translateY(16px);
    transition:transform .3s ease;
  }
  #screen-project.open .project-window{
    transform:scale(1) translateY(0);
  }
  .project-nav-top{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    pointer-events:none;
    z-index:5;
  }
  .project-navbtn{
    pointer-events:auto;
    width:38px;height:38px;
    border-radius:50%;
    background:rgba(243,233,199,.9);
    border:2px solid var(--ink);
    font-size:17px;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    transition:transform .15s ease, background .15s ease;
    flex-shrink:0;
  }
  .project-navbtn:hover{ background:#fff; transform:scale(1.08); }
  .overlay-close{
    position:absolute;
    top:12px;right:12px;
    width:32px;height:32px;
    border-radius:50%;
    background:var(--cream);
    border:2px solid var(--ink);
    font-size:18px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    transition:transform .15s ease;
    z-index:6;
  }
  .overlay-close:hover{ transform:scale(1.08); }
  .monitor{
    width:min(680px,80vw);
    background:#151515;
    border-radius:10px;
    padding:16px 16px 26px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .monitor::after{
    content:"";
    position:absolute;
    left:50%;bottom:-14px;
    transform:translateX(-50%);
    width:110px;height:14px;
    background:#0e0e0e;
    border-radius:0 0 6px 6px;
  }
  .monitor-screen{
    aspect-ratio:16/9;
    border-radius:4px;
    background:linear-gradient(135deg, rgba(255,255,255,.12), transparent), var(--thumb-color,#456);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .play-icon{
    width:0;height:0;
    border-top:20px solid transparent;
    border-bottom:20px solid transparent;
    border-left:32px solid rgba(255,255,255,.9);
    filter:drop-shadow(0 0 8px rgba(0,0,0,.4));
  }
  .project-info{
    text-align:center;
    max-width:640px;
  }
  .project-info h2{
    margin:0 0 10px;
    letter-spacing:1px;
  }
  .project-info p{
    font-size:14px;
    line-height:1.7;
    color:#4a4030;
  }
  .project-switch{
    display:flex;
    gap:14px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- LANDING -->
  <section id="screen-landing" class="screen active">
    <div class="landing-glow"></div>
    <div class="landing-slogan">Your Slogan Here</div>
    <h1 class="landing-title">DMT SHOWCASE</h1>
    <button class="btn" id="enterBtn">ENTER</button>
  </section>

  <!-- INTRO -->
  <section id="screen-intro" class="screen">
    <button class="btn back-btn" id="introBack">BACK</button>
    <div class="intro-wrap">
      <div class="mascot">
        <div class="hat"></div>
        <div class="head">
          <div class="ear l"></div>
          <div class="ear r"></div>
          <div class="visor"></div>
        </div>
        <div class="body">
          <div class="arm l"></div>
          <div class="arm r"></div>
          <div class="core"></div>
        </div>
      </div>
      <div class="intro-text">
        <div class="intro-label">Introduction</div>
        <div class="intro-body" id="introBody"></div>
        <div class="intro-dots" id="introDots"></div>
        <button class="btn" id="nextBtn">NEXT</button>
      </div>
    </div>
  </section>

  <!-- SHELF -->
  <section id="screen-shelf" class="screen">
    <button class="btn back-btn" id="shelfBack">BACK</button>
    <div class="shelf-title">Choose a Category</div>
    <div class="bookcase-wrap">
      <div class="bookcase-viewport">
        <div class="bookcase-stack" id="bookcaseStack"></div>
      </div>
      <div class="vslider-wrap">
        <span>&#9650;</span>
        <div class="vslider-track">
          <input type="range" id="shelfSlider" min="0" max="1000" value="0">
        </div>
        <span>&#9660;</span>
      </div>
    </div>
  </section>

  <!-- CATEGORY SPREAD (overlay window on top of the shelf) -->
  <section id="screen-category">
    <div class="overlay-backdrop" id="categoryBackdrop"></div>
    <div class="book-spread">
      <button class="overlay-close" id="categoryClose">&times;</button>
      <div class="cat-title" id="catTitle"></div>
      <div class="page" id="pageLeft"></div>
      <div class="page" id="pageRight"></div>
      <div class="spread-nav">
        <button id="spreadPrev">&#10094;</button>
        <button id="spreadNext">&#10095;</button>
      </div>
    </div>
  </section>

  <!-- PROJECT DETAIL (overlay window on top of the rack) -->
  <section id="screen-project">
    <div class="overlay-backdrop" id="projectBackdrop"></div>
    <div class="project-window">
      <button class="overlay-close" id="projectClose">&times;</button>
      <div class="monitor">
        <div class="project-nav-top">
          <button class="project-navbtn" id="projectPrev">&#10094;</button>
          <button class="project-navbtn" id="projectNext">&#10095;</button>
        </div>
        <div class="monitor-screen" id="projectScreen">
          <div class="play-icon"></div>
        </div>
      </div>
      <div class="project-info">
        <h2 id="projectTitle"></h2>
        <p id="projectDesc"></p>
      </div>
    </div>
  </section>

</div>

<script>
/* ---------------- placeholder data ---------------- */
const introSlides = [
  "Welcome to the DMT Showcase — a collection of projects built by Digital Media Technology students across game development, animation, VR, and more.",
  "Every book on the shelf ahead represents a category of work. Pick one up to browse the projects inside.",
  "Ready to explore? Head to the library and click a spine to begin."
];

// To use a real image for a book spine, add an "image" field pointing at your
// file, e.g. { name:"Board Games", color:"#3c6e5c", image:"images/board-games-spine.jpg" }.
// "color" is still used as a fallback/tint while the image loads or if it's missing.
const categories = [
  { name: "Final Year Project", color: "#8a3b2e" },
  { name: "Board Games", color: "#3c6e5c" },
  { name: "Game Environment", color: "#3a5a8c" },
  { name: "Game Development", color: "#8c6b3a" },
  { name: "Embedded Game Dev", color: "#6b3a8c" },
  { name: "Online Game Dev", color: "#3a8c7a" },
  { name: "Game Engine Design", color: "#8c3a5e" },
  { name: "VR Experience", color: "#4a4a4a" },
  { name: "Mobile Application", color: "#2e5f8a" }
].map((cat, ci) => ({
  ...cat,
  projects: [1,2,3].map(n => ({
    name: `${cat.name} — Project ${n}`,
    desc: "Placeholder description of this student project. Replace with the real summary, tools used, and team credits.",
    color: cat.color
  }))
}));

/* ---------------- state ---------------- */
let introIndex = 0;
let currentCat = null;
let spreadStart = 0;
let currentProjectRef = null;

const $ = id => document.getElementById(id);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* ---------------- landing ---------------- */
$('enterBtn').addEventListener('click', () => {
  introIndex = 0;
  renderIntro();
  showScreen('screen-intro');
});

/* ---------------- intro ---------------- */
function renderIntro(){
  $('introBody').textContent = introSlides[introIndex];
  const dots = $('introDots');
  dots.innerHTML = '';
  introSlides.forEach((_, i) => {
    const d = document.createElement('span');
    if (i === introIndex) d.classList.add('active');
    dots.appendChild(d);
  });
  $('nextBtn').textContent = introIndex === introSlides.length - 1 ? 'ENTER LIBRARY' : 'NEXT';
}
$('introBack').addEventListener('click', () => {
  showScreen('screen-landing');
});
$('nextBtn').addEventListener('click', () => {
  if (introIndex < introSlides.length - 1){
    introIndex++;
    renderIntro();
  } else {
    renderShelf();
    showScreen('screen-shelf');
  }
});

/* ---------------- shelf ---------------- */
function chunkIntoPlatforms(list){
  // groups of 4-5 books per shelf platform
  const platforms = [];
  let i = 0;
  while (i < list.length){
    const remaining = list.length - i;
    let size = remaining <= 5 ? remaining : (Math.random() < 0.5 ? 4 : 5);
    if (remaining - size < 3 && remaining - size > 0) size = remaining; // avoid a tiny leftover platform
    platforms.push(list.slice(i, i + size));
    i += size;
  }
  return platforms;
}

function buildPlatform(group){
  const platform = document.createElement('div');
  platform.className = 'shelf-platform';
  group.forEach(({ cat, index }) => {
    const b = document.createElement('div');
    b.className = 'book';
    b.textContent = cat.name;
    b.dataset.catIndex = index;
    if (cat.image){
      // image spine, with color as a tinted backdrop while it loads
      b.style.background = `linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)), ${cat.color} url('${cat.image}') center/cover no-repeat`;
    } else {
      b.style.background = cat.color;
    }
    // vary height so tops look uneven, like real books on a shelf
    b.style.height = (170 + Math.round(Math.random() * 40)) + 'px';
    // slight random lean, like a book left slightly askew
    b.style.setProperty('--tilt', (Math.random() * 8 - 4).toFixed(1) + 'deg');
    // random gap around each book for uneven spacing
    b.style.marginLeft = (6 + Math.round(Math.random() * 22)) + 'px';
    b.style.marginRight = (6 + Math.round(Math.random() * 22)) + 'px';
    platform.appendChild(b);
  });
  return platform;
}
function attachBookHandlers(container){
  container.querySelectorAll('.book').forEach(b => {
    const idx = parseInt(b.dataset.catIndex, 10);
    b.addEventListener('click', () => openCategory(idx));
  });
}

function renderShelf(){
  const stack = $('bookcaseStack');
  stack.innerHTML = '';
  let globalIndex = 0;
  const platforms = chunkIntoPlatforms(categories).map(group =>
    group.map(cat => ({ cat, index: globalIndex++ }))
  );

  // build one real copy (randomized), then clone it for a second, identical
  // copy right after — scrolling past the end lands you back at a pixel-perfect
  // match for the start, so the loop feels endless
  const loopStart = document.createDocumentFragment();
  platforms.forEach(group => loopStart.appendChild(buildPlatform(group)));
  stack.appendChild(loopStart);
  attachBookHandlers(stack);

  const clone = stack.cloneNode(true);
  const newPlatforms = Array.from(clone.children);
  newPlatforms.forEach(p => {
    stack.appendChild(p);
    attachBookHandlers(p);
  });

  setupShelfSlider();
}

function setupShelfSlider(){
  const viewport = document.querySelector('.bookcase-viewport');
  const stack = $('bookcaseStack');
  const slider = $('shelfSlider');
  const sliderWrap = document.querySelector('.vslider-wrap');
  const sliderTrack = document.querySelector('.vslider-track');
  // wait a frame so layout/heights are settled
  requestAnimationFrame(() => {
    // match the vertical slider's length to the (now dynamic) viewport height
    const vh = viewport.clientHeight;
    sliderWrap.style.height = vh + 'px';
    const trackLen = vh - 40; // leave room for the arrow glyphs above/below
    sliderTrack.style.height = trackLen + 'px';
    slider.style.width = trackLen + 'px';

    const loopHeight = stack.scrollHeight / 2;
    slider.max = loopHeight;
    slider.value = 0;
    stack.style.transform = 'translateY(0px)';

    const moveTo = (value) => {
      // wrap around the loop point so scrolling past the bottom
      // seamlessly continues from the (identical) top copy
      const wrapped = ((value % loopHeight) + loopHeight) % loopHeight;
      slider.value = wrapped;
      stack.style.transform = `translateY(-${wrapped}px)`;
    };
    slider.oninput = () => moveTo(Number(slider.value));

    // let mouse wheel / trackpad scroll the shelf too, not just the slider
    viewport.onwheel = (e) => {
      e.preventDefault();
      moveTo(Number(slider.value) + e.deltaY);
    };
  });
}
$('shelfBack').addEventListener('click', () => {
  showScreen('screen-intro');
});

/* ---------------- category spread (overlay window) ---------------- */
function openCategory(i){
  currentCat = i;
  spreadStart = 0;
  renderSpread();
  $('screen-category').classList.add('open');
}
function closeCategory(){
  closeProject();
  $('screen-category').classList.remove('open');
}
function renderSpread(){
  const cat = categories[currentCat];
  $('catTitle').textContent = cat.name;
  const left = cat.projects[spreadStart];
  const right = cat.projects[spreadStart + 1];
  $('pageLeft').innerHTML = pageHTML(left);
  $('pageRight').innerHTML = right ? pageHTML(right) : '';
  $('spreadPrev').disabled = spreadStart === 0;
  $('spreadNext').disabled = spreadStart + 2 >= cat.projects.length;

  document.querySelectorAll('.proj-thumb').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx, 10);
      openProject(currentCat, idx);
    });
  });
}
function pageHTML(proj){
  if (!proj) return '';
  const idx = categories[currentCat].projects.indexOf(proj);
  return `
    <div class="proj-thumb" style="--thumb-color:${proj.color}" data-idx="${idx}">
      <div class="play-icon"></div>
    </div>
    <div class="proj-name">${proj.name}</div>
    <div class="proj-desc">${proj.desc}</div>
  `;
}
function flipSpread(direction){
  const spreadEl = document.querySelector('.book-spread');
  const isNext = direction === 'next';
  const sourceEl = isNext ? $('pageRight') : $('pageLeft');
  if (!sourceEl.innerHTML.trim()) return; // nothing on that page to flip

  // snapshot the current page as a floating clone, then swap the real
  // content underneath immediately so the new page is revealed as it turns
  const clone = document.createElement('div');
  clone.className = 'flip-page ' + (isNext ? 'right' : 'left');
  clone.innerHTML = sourceEl.innerHTML;
  spreadEl.appendChild(clone);
  clone.addEventListener('animationend', () => clone.remove(), { once:true });

  spreadStart += isNext ? 2 : -2;
  renderSpread();
}
$('spreadPrev').addEventListener('click', () => flipSpread('prev'));
$('spreadNext').addEventListener('click', () => flipSpread('next'));
$('categoryClose').addEventListener('click', closeCategory);
$('categoryBackdrop').addEventListener('click', closeCategory);

/* ---------------- project detail (overlay window) ---------------- */
function openProject(catIdx, projIdx){
  currentProjectRef = { catIdx, projIdx };
  renderProject();
  $('screen-project').classList.add('open');
}
function renderProject(){
  const { catIdx, projIdx } = currentProjectRef;
  const projects = categories[catIdx].projects;
  const proj = projects[projIdx];
  $('projectScreen').style.setProperty('--thumb-color', proj.color);
  $('projectTitle').textContent = proj.name;
  $('projectDesc').textContent = proj.desc + " (Full write-up, credits, and media go here.)";
  const multi = projects.length > 1;
  $('projectPrev').style.display = multi ? 'flex' : 'none';
  $('projectNext').style.display = multi ? 'flex' : 'none';
}
function goToProject(delta){
  const { catIdx, projIdx } = currentProjectRef;
  const projects = categories[catIdx].projects;
  // wraps around so you can keep browsing without going back to the book
  const nextIdx = (projIdx + delta + projects.length) % projects.length;
  currentProjectRef = { catIdx, projIdx: nextIdx };
  renderProject();
}
function closeProject(){
  $('screen-project').classList.remove('open');
}
$('projectClose').addEventListener('click', closeProject);
$('projectBackdrop').addEventListener('click', closeProject);
$('projectPrev').addEventListener('click', () => goToProject(-1));
$('projectNext').addEventListener('click', () => goToProject(1));
document.addEventListener('keydown', (e) => {
  if ($('screen-project').classList.contains('open')){
    if (e.key === 'Escape') closeProject();
    else if (e.key === 'ArrowRight') goToProject(1);
    else if (e.key === 'ArrowLeft') goToProject(-1);
    return;
  }
  if (e.key === 'Escape' && $('screen-category').classList.contains('open')) closeCategory();
});
</script>
